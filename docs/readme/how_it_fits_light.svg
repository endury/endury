<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">How Endury fits together</title>
  <desc id="d">Endury runs in a browser tab and talks only to intervals.icu and, optionally, OpenRouter. Your watch, bike computer and heart-rate strap already sync to intervals.icu; Endury pushes structured workouts there and reads your activities, thresholds, fitness and wellness back.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2328; }
      .h { font-size: 15px; font-weight: 600; }
      .s { font-size: 12px; fill: #59636E; }
      .chip { font-size: 11.5px; fill: #1F2328; }
      .box { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.2; }
      .panel { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .line { stroke: #59636E; stroke-width: 1.6; fill: none; }
      .dash { stroke: #59636E; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .ico { stroke: #1F2328; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636E"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="18" fill="#F6F8FA" stroke="#D0D7DE"/>

  <!-- the browser tab -->
  <rect x="40" y="28" width="580" height="100" rx="12" class="panel"/>
  <rect x="40" y="28" width="580" height="30" rx="12" fill="#FFFFFF"/>
  <rect x="40" y="46" width="580" height="12" fill="#FFFFFF"/>
  <circle cx="60" cy="43" r="4.5" fill="#D0D7DE"/>
  <circle cx="74" cy="43" r="4.5" fill="#D0D7DE"/>
  <circle cx="88" cy="43" r="4.5" fill="#D0D7DE"/>
  <rect x="110" y="34" width="150" height="18" rx="9" fill="#F6F8FA"/>
  <text x="124" y="47" class="s">endury.app</text>
  <text x="60" y="86" class="h">Endury, in your browser tab</text>
  <text x="60" y="108" class="s">The planner, the coach and your keys stay here. There is no server.</text>

  <!-- OpenRouter (optional) -->
  <rect x="684" y="28" width="236" height="100" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-dasharray="6 4"/>
  <text x="702" y="54" class="h">OpenRouter</text>
  <text x="902" y="54" class="s" text-anchor="end">optional</text>
  <text x="702" y="78" class="s">The AI language model</text>
  <text x="702" y="95" class="s">behind the chat coach,</text>
  <text x="702" y="112" class="s">billed to your own key.</text>
  <path d="M620 78 L684 78" class="dash" marker-end="url(#a)"/>

  <!-- arrows tab to and from intervals.icu -->
  <path d="M180 128 L180 200" class="line" marker-end="url(#a)"/>
  <text x="194" y="160" class="s">workouts, races and</text>
  <text x="194" y="177" class="s">Endury's saved data</text>
  <path d="M440 200 L440 128" class="line" marker-end="url(#a)"/>
  <text x="454" y="160" class="s">activities, thresholds,</text>
  <text x="454" y="177" class="s">fitness and wellness</text>

  <!-- intervals.icu -->
  <rect x="40" y="200" width="880" height="106" rx="12" class="box"/>
  <text x="60" y="228" class="h">intervals.icu</text>
  <text x="60" y="248" class="s">Your training platform, free for what Endury needs, and the only place Endury stores anything.</text>
  <g>
    <rect x="60" y="264" width="96" height="24" rx="12" fill="#E7ECF0"/>
    <text x="108" y="280" class="chip" text-anchor="middle">Calendar</text>
    <rect x="164" y="264" width="96" height="24" rx="12" fill="#E7ECF0"/>
    <text x="212" y="280" class="chip" text-anchor="middle">Activities</text>
    <rect x="268" y="264" width="104" height="24" rx="12" fill="#E7ECF0"/>
    <text x="320" y="280" class="chip" text-anchor="middle">Thresholds</text>
    <rect x="380" y="264" width="96" height="24" rx="12" fill="#E7ECF0"/>
    <text x="428" y="280" class="chip" text-anchor="middle">Wellness</text>
    <rect x="484" y="264" width="88" height="24" rx="12" fill="#E7ECF0"/>
    <text x="528" y="280" class="chip" text-anchor="middle">Fitness</text>
    <rect x="580" y="264" width="280" height="24" rx="12" fill="#E7ECF0" stroke="#3F8A53"/>
    <text x="720" y="280" class="chip" text-anchor="middle">Endury's data, in two hidden notes</text>
  </g>

  <!-- arrows intervals.icu to and from the devices -->
  <path d="M130 306 L130 344" class="line" marker-end="url(#a)"/>
  <text x="144" y="322" class="s">workouts</text>
  <text x="144" y="338" class="s">to your watch</text>
  <path d="M440 344 L440 306" class="line" marker-end="url(#a)"/>
  <path d="M720 344 L720 306" class="line" marker-end="url(#a)"/>
  <text x="454" y="322" class="s">finished activities</text>
  <text x="454" y="338" class="s">upload by themselves</text>

  <!-- watch -->
  <g transform="translate(96,348)">
    <rect x="22" y="0" width="24" height="10" rx="3" class="ico"/>
    <rect x="22" y="50" width="24" height="10" rx="3" class="ico"/>
    <rect x="12" y="10" width="44" height="40" rx="10" class="ico"/>
    <path d="M20 30 h8 l4 -9 l5 18 l4 -9 h7" class="ico"/>
    <text x="34" y="80" class="s" text-anchor="middle">watch</text>
  </g>
  <!-- bike computer and power meter -->
  <g transform="translate(388,348)">
    <rect x="0" y="0" width="38" height="60" rx="8" class="ico"/>
    <rect x="8" y="10" width="22" height="24" rx="3" class="ico"/>
    <circle cx="80" cy="30" r="22" class="ico"/>
    <circle cx="80" cy="30" r="6" class="ico"/>
    <path d="M80 8 v16 M80 36 v16 M58 30 h16 M86 30 h16" class="ico"/>
    <text x="52" y="80" class="s" text-anchor="middle">bike computer, power meter</text>
  </g>
  <!-- heart-rate strap -->
  <g transform="translate(668,348)">
    <rect x="0" y="22" width="104" height="18" rx="9" class="ico"/>
    <path d="M52 38 c-9 -8 -16 -13 -16 -21 a8 8 0 0 1 16 -3 a8 8 0 0 1 16 3 c0 8 -7 13 -16 21z" class="ico" style="fill: #F6F8FA"/>
    <text x="52" y="80" class="s" text-anchor="middle">heart-rate strap</text>
  </g>
</svg>
