  <rect x="356" y="205" width="72.1" height="16" rx="4" class="model"/>
  <text x="462" y="218" class="n">137 / 190</text>
  <text x="462" y="230" class="bad">no plan in 2</text>
  <text x="552" y="218" class="n">20 ¢ · 30 ¢</text>
  <text x="684" y="218" class="n">3 min · 18 min</text>
  <text x="816" y="218" class="note">few fuelling cues (11/11)</text>
  <text x="24" y="254" class="row">Gemini 3.8 Flash</text>
  <rect x="176" y="241" width="100" height="16" rx="4" class="track"/>
  <rect x="176" y="241" width="70.2" height="16" rx="4" class="model"/>
  <text x="282" y="254" class="n">118 / 168</text>
  <rect x="356" y="241" width="100" height="16" rx="4" class="track"/>
  <rect x="356" y="241" width="77.9" height="16" rx="4" class="model"/>
  <text x="462" y="254" class="n">176 / 226</text>
  <text x="462" y="266" class="bad">no plan in 1</text>
  <text x="552" y="254" class="n">2 ¢ · 6 ¢</text>
  <text x="684" y="254" class="n">31 s · 79 s</text>
  <text x="816" y="254" class="note">few fuelling cues (12/12)</text>
  <text x="24" y="290" class="row">Grok 4.7</text>
  <rect x="176" y="277" width="100" height="16" rx="4" class="track"/>
  <rect x="176" y="277" width="73.2" height="16" rx="4" class="model"/>
  <text x="282" y="290" class="n">123 / 168</text>
  <rect x="356" y="277" width="100" height="16" rx="4" class="track"/>
  <rect x="356" y="277" width="73.3" height="16" rx="4" class="model"/>
  <text x="462" y="290" class="n">195 / 266</text>
  <text x="552" y="290" class="n">8 ¢ · 19 ¢</text>
  <text x="684" y="290" class="n">3 min · 7 min</text>
  <text x="816" y="290" class="note">few fuelling cues (13/13)</text>
  <text x="24" y="326" class="row">GPT-6 Sol</text>
  <rect x="176" y="313" width="100" height="16" rx="4" class="track"/>
  <rect x="176" y="313" width="73.1" height="16" rx="4" class="model"/>
  <text x="282" y="326" class="n">117 / 160</text>
  <rect x="356" y="313" width="100" height="16" rx="4" class="track"/>
  <rect x="356" y="313" width="73.2" height="16" rx="4" class="model"/>
  <text x="462" y="326" class="n">167 / 228</text>
  <text x="462" y="338" class="bad">no plan in 1</text>
  <text x="552" y="326" class="n">5 ¢ · 14 ¢</text>
  <text x="684" y="326" class="n">69 s · 3 min</text>
  <text x="816" y="326" class="note">few fuelling cues (11/12)</text>
  <text x="24" y="362" class="row">DeepSeek V4.1 Flash</text>
  <rect x="176" y="349" width="100" height="16" rx="4" class="track"/>
  <rect x="176" y="349" width="70.8" height="16" rx="4" class="model"/>
  <text x="282" y="362" class="n">119 / 168</text>
  <rect x="356" y="349" width="100" height="16" rx="4" class="track"/>
  <rect x="356" y="349" width="70.3" height="16" rx="4" class="model"/>
  <text x="462" y="362" class="n">187 / 266</text>
  <text x="552" y="362" class="n">0.7 ¢ · 2 ¢</text>
  <text x="684" y="362" class="n">2 min · 3 min</text>
  <text x="816" y="362" class="note">few fuelling cues (13/13)</text>
  <text x="24" y="398" class="row">Gemini 3.5 Flash Lite</text>
  <rect x="176" y="385" width="100" height="16" rx="4" class="track"/>
  <rect x="176" y="385" width="75.3" height="16" rx="4" class="model"/>
