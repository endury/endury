<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490" role="img" aria-labelledby="t d">
  <title id="t">The training-plan benchmark</title>
  <desc id="d">Rules met out of the rulebook's bands over 6 marathon cells and 8 long-course cells: Endury's planner 146 of 156 and 254 of 265; Claude Opus 5.5 139 of 168 and 225 of 265; Claude Sonnet 5 132 of 168 and 137 of 190, no plan in 2 cell(s); Gemini 3.8 Flash 118 of 168 and 176 of 226, no plan in 1 cell(s); Grok 4.7 123 of 168 and 195 of 266; GPT-6 Sol 117 of 160 and 167 of 228, no plan in 1 cell(s); DeepSeek V4.1 Flash 119 of 168 and 187 of 266; Gemini 3.5 Flash Lite 122.0 of 162 and 154.5 of 259.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E5E5E7; }
      .h { font-size: 15px; font-weight: 600; }
      .col { font-size: 12.5px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #ADADB1; }
      .row { font-size: 12.5px; }
      .rowb { font-size: 12.5px; font-weight: 700; }
      .n { font-size: 12px; fill: #E5E5E7; }
      .note { font-size: 11px; fill: #ADADB1; }
      .bad { font-size: 11px; fill: #C68F6C; font-weight: 600; }
      .track { fill: #2D2D30; }
      .model { fill: #B5B3AE; }
      .endury { fill: #86AD90; }
    </style>
  </defs>
  <rect width="1040" height="490" rx="18" fill="#19191B" stroke="none"/>
  <text x="24" y="38" class="h">Rules met, out of the rulebook's bands, over 13 plans</text>
  <text x="24" y="58" class="s">The same brief for every contestant, complete plans down to the workout steps, nothing about the rules in the brief. Endury's own rulebook, and its plans are tuned against it.</text>
  <text x="24" y="74" class="s">One draw per AI model (Flash Lite: three to five). Cost and time are the median for one plan.</text>
  <text x="176" y="106" class="col">6 marathon plans</text>
  <text x="356" y="106" class="col">8 long-course plans</text>
  <text x="552" y="106" class="col">Cost per plan</text>
  <text x="552" y="119" class="s" style="font-size: 10px">marathon · long course</text>
  <text x="684" y="106" class="col">Time per plan</text>
  <text x="684" y="119" class="s" style="font-size: 10px">marathon · long course</text>
  <text x="816" y="106" class="col">Most frequent miss (plans)</text>
  <text x="24" y="146" class="rowb">Endury's planner</text>
  <rect x="176" y="133" width="100" height="16" rx="4" class="track"/>
  <rect x="176" y="133" width="93.6" height="16" rx="4" class="endury"/>
  <text x="282" y="146" class="n">146 / 156</text>
  <rect x="356" y="133" width="100" height="16" rx="4" class="track"/>
  <rect x="356" y="133" width="95.8" height="16" rx="4" class="endury"/>
  <text x="462" y="146" class="n">254 / 265</text>
  <text x="552" y="146" class="n">free · free</text>
  <text x="684" y="146" class="n">0.2 s · 0.6 s</text>
  <text x="816" y="146" class="note">rest days (6/13)</text>
  <text x="24" y="182" class="row">Claude Opus 5.5</text>
  <rect x="176" y="169" width="100" height="16" rx="4" class="track"/>
  <rect x="176" y="169" width="82.7" height="16" rx="4" class="model"/>
  <text x="282" y="182" class="n">139 / 168</text>
  <rect x="356" y="169" width="100" height="16" rx="4" class="track"/>
  <rect x="356" y="169" width="84.9" height="16" rx="4" class="model"/>
  <text x="462" y="182" class="n">225 / 265</text>
  <text x="552" y="182" class="n">31 ¢ · 56 ¢</text>
  <text x="684" y="182" class="n">76 s · 4 min</text>
  <text x="816" y="182" class="note">few fuelling cues (13/13)</text>
