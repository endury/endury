  <rect x="356" y="385" width="100" height="16" rx="4" class="track"/>
  <rect x="356" y="385" width="59.7" height="16" rx="4" class="model"/>
  <text x="462" y="398" class="n">154 / 259</text>
  <text x="552" y="398" class="n">0.7 ¢ · 3 ¢</text>
  <text x="684" y="398" class="n">7 s · 23 s</text>
  <text x="816" y="398" class="note">few fuelling cues (13/13)</text>
  <line x1="24" y1="420" x2="1016" y2="420" stroke="#333336"/>
  <text x="24" y="440" class="note">A plan is graded on the rules that apply to it, so totals differ by contestant; an AI model with no plan for a brief is graded on the plans it wrote.</text>
  <text x="24" y="472" class="note">The Claude models ran through Claude Code on a subscription: their cost is an estimate at list price and their time is not comparable. The brief left session notes optional.</text>
  <text x="24" y="456" class="note">Rulebook version 6, 39 rules with evidence grades and sources in bench/rulebook.yaml. Measured 2026-11-03.</text>
</svg>
