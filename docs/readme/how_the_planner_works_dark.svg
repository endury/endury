<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="t d">
  <title id="t">How the planner works</title>
  <desc id="d">Four steps turn your race, your ambition and your recent training into a plan: phases, session menus, sizing and the calendar. Every change to the planner is graded against Endury's own rulebook. Below, the planner's 32-week full-distance plan, week by week: 6.4 hours in the first week, 16.2 hours in the peak week, 4.6 hours in race week, with a recovery week every fourth week.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E5E5E7; }
      .h { font-size: 15px; font-weight: 600; }
      .n { font-size: 24px; font-weight: 700; fill: #B5B3AE; }
      .s { font-size: 12.5px; fill: #ADADB1; }
      .k { font-size: 12.5px; fill: #E5E5E7; }
      .t { font-size: 11px; fill: #ADADB1; }
      .box { fill: #232325; stroke: #6D6D70; stroke-width: 1.2; }
      .in { fill: #1C1C1E; stroke: #6D6D70; stroke-width: 1; }
      .line { stroke: #ADADB1; stroke-width: 1.6; fill: none; }
      .gate { stroke: #86AD90; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ADADB1"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#86AD90"/>
    </marker>
  </defs>

  <rect width="960" height="590" rx="18" fill="#19191B"/>

  <!-- inputs -->
  <rect x="22" y="24" width="152" height="124" rx="12" class="in"/>
  <text x="36" y="58" class="h">What goes in</text>
  <text x="36" y="84" class="k">Race and date</text>
  <text x="36" y="102" class="k">Your ambition</text>
  <text x="36" y="120" class="k">Recent training</text>

  <path d="M174 86 L198 86" class="line" marker-end="url(#a)"/>

  <!-- step 1 -->
  <rect x="198" y="24" width="167" height="124" rx="12" class="box"/>
  <text x="212" y="58" class="n">1</text>
  <text x="234" y="58" class="h">Phases</text>
  <text x="212" y="84" class="s">Base, build, peak,</text>
  <text x="212" y="102" class="s">taper, race, and</text>
  <text x="212" y="120" class="s">recovery weeks.</text>

  <path d="M365 86 L389 86" class="line" marker-end="url(#a)"/>

  <!-- step 2 -->
  <rect x="389" y="24" width="167" height="124" rx="12" class="box"/>
  <text x="403" y="58" class="n">2</text>
  <text x="425" y="58" class="h">Menus</text>
  <text x="403" y="84" class="s">A weekly template</text>
  <text x="403" y="102" class="s">for every goal</text>
  <text x="403" y="120" class="s">and phase.</text>

  <path d="M556 86 L580 86" class="line" marker-end="url(#a)"/>

  <!-- step 3 -->
  <rect x="580" y="24" width="167" height="124" rx="12" class="box"/>
  <text x="594" y="58" class="n">3</text>
  <text x="616" y="58" class="h">Sizing</text>
  <text x="594" y="84" class="s">A solver sizes</text>
  <text x="594" y="102" class="s">each session for</text>
  <text x="594" y="120" class="s">a smooth ramp.</text>

  <path d="M747 86 L771 86" class="line" marker-end="url(#a)"/>

  <!-- step 4 -->
  <rect x="771" y="24" width="167" height="124" rx="12" class="box"/>
  <text x="785" y="58" class="n">4</text>
  <text x="807" y="58" class="h">Calendar</text>
  <text x="785" y="84" class="s">Workouts on</text>
  <text x="785" y="102" class="s">intervals.icu and</text>
  <text x="785" y="120" class="s">on your watch.</text>

  <!-- the gate -->
  <rect x="198" y="170" width="740" height="56" rx="10" fill="#1C1C1E" stroke="#86AD90" stroke-dasharray="6 4"/>
  <text x="214" y="194" class="h">Checked on every change</text>
  <text x="214" y="213" class="s">Every edit is graded against Endury's own rulebook. A worse reading fails the checks.</text>
  <path d="M472 148 L472 170" class="gate" marker-end="url(#g)"/>
  <path d="M663 148 L663 170" class="gate" marker-end="url(#g)"/>

  <!-- the plan: 32-week full-distance, competitive, as graded in the benchmark -->
  <text x="22" y="262" class="h">What comes out: a 32-week full-distance plan, hours per week</text>
  <text x="22" y="281" class="s">An athlete training 9 hours a week, competitive ambition. The benchmark below grades this plan.</text>

  <!-- axis: 12 px per hour, 0 at y 524 -->
  <line x1="60" y1="524" x2="936" y2="524" stroke="#6D6D70" stroke-width="1"/>
  <text x="52" y="528" class="t" text-anchor="end">0</text>
  <line x1="60" y1="428" x2="936" y2="428" stroke="#3A3A3D" stroke-width="1"/>
  <text x="52" y="432" class="t" text-anchor="end">8 h</text>
  <line x1="60" y1="332" x2="936" y2="332" stroke="#3A3A3D" stroke-width="1"/>
  <text x="52" y="336" class="t" text-anchor="end">16 h</text>

  <!-- bars: x = 66 + (week - 1) * 27, width 22, height = hours * 12 -->
  <g>
    <!-- base -->
    <rect x="66" y="447.2" width="22" height="76.8" rx="3" fill="#8A9BA8"/>
    <rect x="93" y="444.4" width="22" height="79.6" rx="3" fill="#8A9BA8"/>
    <rect x="120" y="437.6" width="22" height="86.4" rx="3" fill="#8A9BA8"/>
    <rect x="147" y="452.8" width="22" height="71.2" rx="3" fill="#8A9BA8" opacity="0.55"/>
    <rect x="174" y="426.1" width="22" height="97.9" rx="3" fill="#8A9BA8"/>
    <rect x="201" y="420.3" width="22" height="103.7" rx="3" fill="#8A9BA8"/>
    <rect x="228" y="412.3" width="22" height="111.7" rx="3" fill="#8A9BA8"/>
    <rect x="255" y="447.8" width="22" height="76.2" rx="3" fill="#8A9BA8" opacity="0.55"/>
    <rect x="282" y="401.6" width="22" height="122.4" rx="3" fill="#8A9BA8"/>
    <rect x="309" y="395.8" width="22" height="128.2" rx="3" fill="#8A9BA8"/>
    <rect x="336" y="388.4" width="22" height="135.6" rx="3" fill="#8A9BA8"/>
    <rect x="363" y="447.0" width="22" height="77.0" rx="3" fill="#8A9BA8" opacity="0.55"/>
    <rect x="390" y="382.2" width="22" height="141.8" rx="3" fill="#8A9BA8"/>
    <rect x="417" y="381.6" width="22" height="142.4" rx="3" fill="#8A9BA8"/>
    <!-- build -->
    <rect x="444" y="355.4" width="22" height="168.6" rx="3" fill="#7FA8AC"/>
    <rect x="471" y="427.8" width="22" height="96.2" rx="3" fill="#7FA8AC" opacity="0.55"/>
    <rect x="498" y="349.0" width="22" height="175.0" rx="3" fill="#7FA8AC"/>
    <rect x="525" y="343.3" width="22" height="180.7" rx="3" fill="#7FA8AC"/>
    <rect x="552" y="338.1" width="22" height="185.9" rx="3" fill="#7FA8AC"/>
    <rect x="579" y="417.0" width="22" height="107.0" rx="3" fill="#7FA8AC" opacity="0.55"/>
    <rect x="606" y="332.6" width="22" height="191.4" rx="3" fill="#7FA8AC"/>
    <rect x="633" y="331.4" width="22" height="192.6" rx="3" fill="#7FA8AC"/>
    <rect x="660" y="329.6" width="22" height="194.4" rx="3" fill="#7FA8AC"/>
    <rect x="687" y="413.0" width="22" height="111.0" rx="3" fill="#7FA8AC" opacity="0.55"/>
    <!-- peak -->
    <rect x="714" y="349.0" width="22" height="175.0" rx="3" fill="#C2A96B"/>
    <rect x="741" y="349.0" width="22" height="175.0" rx="3" fill="#C2A96B"/>
    <rect x="768" y="363.9" width="22" height="160.1" rx="3" fill="#C2A96B"/>
    <rect x="795" y="420.0" width="22" height="104.0" rx="3" fill="#C2A96B" opacity="0.55"/>
    <rect x="822" y="369.6" width="22" height="154.4" rx="3" fill="#C2A96B"/>
    <!-- taper -->
    <rect x="849" y="399.1" width="22" height="124.9" rx="3" fill="#C68F6C"/>
    <rect x="876" y="432.1" width="22" height="91.9" rx="3" fill="#C68F6C"/>
    <!-- race week -->
    <rect x="903" y="468.4" width="22" height="55.6" rx="3" fill="#86AD90"/>
  </g>

  <!-- the peak week -->
  <text x="671" y="316" class="k" text-anchor="middle">peak week 16.2 h</text>
  <path d="M671 321 L671 327" class="line"/>

  <!-- week ticks -->
  <text x="77" y="541" class="t" text-anchor="middle">1</text>
  <text x="185" y="541" class="t" text-anchor="middle">5</text>
  <text x="320" y="541" class="t" text-anchor="middle">10</text>
  <text x="455" y="541" class="t" text-anchor="middle">15</text>
  <text x="590" y="541" class="t" text-anchor="middle">20</text>
  <text x="725" y="541" class="t" text-anchor="middle">25</text>
  <text x="860" y="541" class="t" text-anchor="middle">30</text>
  <text x="914" y="541" class="t" text-anchor="middle">race</text>

  <!-- legend -->
  <g transform="translate(66,568)">
    <rect x="0" y="-10" width="12" height="12" rx="2" fill="#8A9BA8"/><text x="18" y="1" class="s">base</text>
    <rect x="80" y="-10" width="12" height="12" rx="2" fill="#7FA8AC"/><text x="98" y="1" class="s">build</text>
    <rect x="164" y="-10" width="12" height="12" rx="2" fill="#C2A96B"/><text x="182" y="1" class="s">peak</text>
    <rect x="246" y="-10" width="12" height="12" rx="2" fill="#C68F6C"/><text x="264" y="1" class="s">taper</text>
    <rect x="332" y="-10" width="12" height="12" rx="2" fill="#86AD90"/><text x="350" y="1" class="s">race week, 4.6 h</text>
    <rect x="496" y="-10" width="12" height="12" rx="2" fill="#8A9BA8" opacity="0.55"/><text x="514" y="1" class="s">recovery week, every fourth</text>
  </g>
</svg>
