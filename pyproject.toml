[tool.poetry]
name = "endury"
version = "0.1.0"
description = "A free, open-source endurance coach that runs entirely in the browser"
license = "AGPL-3.0-or-later"
authors = ["Kim <contact@endury.app>"]
readme = "README.md"
homepage = "https://endury.app"
repository = "https://github.com/endury/endury"
keywords = ["endurance", "training-plan", "triathlon", "running", "trail-running", "intervals-icu", "coaching", "pyodide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Other/Nonlisted Topic",
]
packages = [{include = "endury"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.0"
openai = "^2.24.0"
cvxpy = "^1.8.2"
httpx = "^0.28.1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.4,<0.18.0"
pytest = "^9.0.2"
matplotlib = "^3.9"
pytest-asyncio = "^1.3.0"
mypy = ">=1.19.1,<3.0.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
playwright = "^1.61.0"
python-dotenv = "^1.0.0"

[tool.ruff]
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E", "W", # pycodestyle
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific rules
    "TID",    # flake8-tidy-imports
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "FLY",    # flynt (f-string conversion)
    "PERF",   # perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "ANN",    # flake8-annotations
    "D",      # pydocstyle (Google convention)
    "S",      # flake8-bandit (security)
]
ignore = [
    "E402",    # Module level import not at top of file (some devtools configure DB first)
    "D203",    # One blank line before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary on second line (conflicts with D212)
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "S101",    # Use of assert (needed in tests)
    "D107",    # Missing docstring in __init__ (class docstring suffices)
    "RET504",  # Unnecessary assignment before return
    "SIM905",  # Prefer str.split over massive list literals for stopword tables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "E501"]
"devtools/**" = ["ANN", "S", "E501", "RUF001"]
"endury/wiring/config.py" = ["E501"]  # Long prompt/config strings
"endury/coach/prompt.py" = ["E501", "RUF001"]  # Long system prompt template lines; verbatim minus sign in coach voice copy
"bench/brief.py" = ["E501"]  # The brief is a prompt template; its lines are the model's

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["endury"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "analytics: zone-analysis and race-prediction tests",
    "architecture: architecture-boundary and import-rule tests",
    "coach: coach turn-loop/tool/session tests",
    "contract: contract-focused tests (API/response/behavioral contracts)",
    "db: database/repository tests",
    "golden: golden replay/snapshot style tests",
    "integration: cross-module integration tests",
    "intervals: intervals.icu client/adapter tests",
    "llm: LLM-oriented tests, run offline against fakes",
    "planning: planning engine and planner-service tests",
    "slow: long-running gates excluded from the default `make test`; run by `make test-scorecards` and the pre-push hook",
    "unit: fast deterministic unit-level tests",
]

[tool.coverage.run]
source = ["endury"]

# The rest of endury/ is ungated; endury/planner/ (the deterministic,
# bit-identical planning engine) is the one package that still holds a hard
# 100% floor. `include` filters the *report* (and so `fail_under`), not what
# is measured, so `--cov=endury` still collects data for everything.
[tool.coverage.report]
fail_under = 100
include = ["endury/planner/**"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
