    doi: 10.1123/ijspp.2021-0435
    states: Elite distance runners (incl. marathon) most often show pyramidal TID; polarised appears mainly
      in shorter-duration event specialists.
    verified: crossref
  - citation: 'Treff G, Winkert K, Sareban M, Steinacker JM, Sperlich B (2019). The polarization-index:
