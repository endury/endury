# The rulebook: every band a plan is graded on, with its evidence.
#
# One file, two uses. Endury's quality gate grades its own plans on every rule
# here. The benchmark grades any contestant's plan on the rules that read the
# generic plan table; a rule with `benchmark: false` reads Endury's own plan
# structure instead and is never asked of an AI language model.
#
# The benchmark rules were assembled 2026-09-25 from five research dossiers
# (one per rule family) whose sources were each checked against Crossref
# (papers) or a publisher's ISBN listing (books); `verified` records that
# check, which says a book exists, not that its content was read, so what a
# book's `states` reports is second-hand. Grades: A a meta-analysis or trial, B a cohort or validated model, C
# two or more independent coaching texts, D one source or a convention, S a
# structural rule of the plan itself. `missing` is the distance scored when
# the plan lacks the feature (no taper, no long ride); a rule without it is
# left out when the plan carries no such data (no steps).
#
# A band is `low`/`high`, or a `by_tier` map of them, for every goal the rule
# covers; a goal's own entry under `by_goal` replaces it. `goals` lists the
# race goals a rule covers and is left out when it covers every one. `ramp` is
# the span outside the band over which the distance rises to 1, or `width` for
# the band's own width. A goal's own band carries `why` and may carry `evidence`; where
# no study sets the number, the band is the maintainer's judgement. `weight` is the
# rule's weight in the gate's composite, 1 when left out. The trail 50K bands
# rest on docs/research/trail_running.md, most of it one coach's opinion.
#
# A `why` cites the research pages in docs/research/ by a short name and
# section: tlc is triathlon_long_course.md, tri is triathlon.md, tr is
# trail_running.md, em is endurance_methodology.md, sc is short_course.md.
version: '6'
rules:
- name: recovery_cadence
  family: periodisation
  reading: recovery_cadence
  reads: recovery-labelled weeks over load-plus-recovery weeks
  grade: C
  band:
    low: 0.2
    high: 0.3
  ramp: 0.1
  missing: 1.0
  school_specific: true
  note: A 3:1 to 4:1 cadence, the plan's own mode labels. Until 2026-10-06 the basic tier was graded
    at 2:1 (0.27-0.36), the beginners' cadence of the sources; at 2:1 a basic trail 20K averaged the
    athlete's recent volume over 12 weeks and its long run topped out at 43 percent of the race, and
    the trail research deloads every third or fourth week, so every tier now plans and is graded at 3:1.
  sources:
  - citation: Issurin VB (2010). New Horizons for the Methodology and Physiology of Training Periodization.
      Sports Med 40(3):189-206.
    doi: 10.2165/11319770-000000000-00000
    states: Concentrated training blocks run 2-4 weeks before a deload/transition, framing the 2:1/3:1
      cadence in residual-training-effect terms.
    verified: crossref
  - citation: 'Bompa TO, Buzzichelli C (2018). Periodization: Theory and Methodology of Training (6th
      ed). Human Kinetics. ISBN 9781492544807.'
    isbn: '9781492544807'
    states: Prescribes 3:1 loading:unloading mesocycles as standard, 2:1 for athletes with reduced recovery
      capacity (masters, high life stress).
    verified: isbn
  - citation: Friel J (2024). The Triathlete's Training Bible (5th ed). VeloPress. ISBN 9781646046072.
    isbn: '9781646046072'
    states: Same 3:1/2:1 cadence recommendation, tied explicitly to athlete recovery capacity rather than
      a fixed rule for everyone.
    verified: isbn
- name: recovery_week_depth
  family: periodisation
  reading: recovery_week_depth
  reads: recovery-week hours over the preceding load week, mean
  grade: C
  band:
    low: 0.5
    high: 0.7
  ramp: 0.2
  school_specific: true
  sources:
  - citation: Issurin VB (2010). New Horizons for the Methodology and Physiology of Training Periodization.
      Sports Med 40(3):189-206.
    doi: 10.2165/11319770-000000000-00000
    states: Anaerobic/speed residual effects decay in ~5-8 days, so a deload should cut volume enough
      to dissipate fatigue while keeping some quality touches.
    verified: crossref
  - citation: Friel J (2024). The Triathlete's Training Bible (5th ed). VeloPress. ISBN 9781646046072.
    isbn: '9781646046072'
    states: Recovery weeks cut volume to roughly 50-70% of the preceding load week while frequency is
      preserved.
    verified: isbn
  - citation: 'Bompa TO, Buzzichelli C (2018). Periodization: Theory and Methodology of Training (6th
      ed). Human Kinetics. ISBN 9781492544807.'
    isbn: '9781492544807'
    states: Unloading microcycles reduce volume substantially (consistent with the 50-70% range) while
      maintaining movement frequency for coordination.
    verified: isbn
- name: phase_share_base
  family: periodisation
  reading: phase_share_base
  reads: base weeks over base-plus-build-plus-peak weeks
  grade: C
  goals:
  - half_ironman
  - ironman
  band:
    by_goal:
      ironman:
        low: 0.35
        high: 0.55
        why: Wide enough for short-prep (~40 %) and standard-prep (~50 %) Ironman builds (tlc §3).
      half_ironman:
        low: 0.18
        high: 0.58
        why: The horizon-aware half-distance shares (tlc §3), widened by the maintainer;
          a floor on what may be condemned, not a target.
  ramp: 0.2
  missing: 1.0
  school_specific: true
  note: Traditional periodisation's shares; block periodisation does not use these phases. Not the trail
    goals, whose phase ratios in the trail research are the planner's own example numbers.
  sources:
  - citation: Issurin VB (2010). New Horizons for the Methodology and Physiology of Training Periodization.
      Sports Med, 40(3), 189-206.
    doi: 10.2165/11319770-000000000-00000
    states: Proposes concentrated 2-4 week training blocks by ability rather than a smooth classical phase
      progression, citing differing residual-effect half-lives.
    verified: crossref
  - citation: 'Bompa TO & Buzzichelli C (2018). Periodization: Theory and Methodology of Training, 6th
      ed. Human Kinetics.'
    isbn: '9781492544807'
    states: General Preparation (Base-equivalent) phase should dominate early in a macrocycle before narrowing
      to specific/competitive phases.
    verified: isbn
- name: phase_share_build
  family: periodisation
  reading: phase_share_build
  reads: build weeks over base-plus-build-plus-peak weeks
  grade: C
  goals:
  - half_ironman
  - ironman
  band:
    by_goal:
      ironman:
        low: 0.27
        high: 0.45
        why: Wide enough for short-prep (~40 %) and standard-prep (~32 %) Ironman builds (tlc §3).
      half_ironman:
        low: 0.27
        high: 0.55
        why: The horizon-aware half-distance shares (tlc §3), widened by the maintainer;
          permits more build than the Ironman band.
  ramp: 0.18
  missing: 1.0
  school_specific: true
  sources:
  - citation: Issurin VB (2010). New Horizons for the Methodology and Physiology of Training Periodization.
      Sports Med, 40(3), 189-206.
    doi: 10.2165/11319770-000000000-00000
    states: Proposes concentrated 2-4 week training blocks by ability rather than a smooth classical phase
      progression, citing differing residual-effect half-lives.
    verified: crossref
  - citation: 'Bompa TO & Buzzichelli C (2018). Periodization: Theory and Methodology of Training, 6th
      ed. Human Kinetics.'
    isbn: '9781492544807'
    states: General Preparation (Base-equivalent) phase should dominate early in a macrocycle before narrowing
      to specific/competitive phases.
    verified: isbn
- name: weekly_volume_ramp
  family: periodisation
  reading: weekly_volume_ramp
  reads: largest hours ratio between consecutive load weeks
  grade: C
  goals:
  - running_marathon
  - half_ironman
  - ironman
  - trail_20k
  band:
    low: 0.0
    high: 1.3
  ramp: 0.2
  school_specific: false
  note: The 10 percent rule has no trial support; the injury cohorts flag jumps above 30 percent.
  sources:
  - citation: 'Buist I, Bredeweg SW, van Mechelen W, Lemmink KAPM, Pepping GJ, Diercks RL (2008). No Effect
      of a Graded Training Program on the Number of Running-Related Injuries in Novice Runners: A Randomized
      Controlled Trial. Am J Sports Med 36(1):33-39.'
    doi: 10.1177/0363546507307505
    states: 'RCT: a 13-week ''graded'' (~10%-rule) program showed no injury-rate reduction vs. an 8-week
      standard program.'
    verified: crossref
  - citation: Nielsen RO, Parner ET, Nohr EA, Sorensen H, Lind M, Rasmussen S (2014). Excessive Progression
      in Weekly Running Distance and Risk of Running-Related Injuries. J Orthop Sports Phys Ther 44(10):739-747.
    doi: 10.2519/jospt.2014.5164
    states: 'Cohort: >30% increase in weekly distance over 2 weeks raised risk for some (not all) injury
      types; risk did not rise linearly below that.'
    verified: crossref
  - citation: Damsted C, Glad S, Nielsen RO, Sorensen H, Malisoux L (2018). Is There Evidence for an Association
      Between Changes in Training Load and Running-Related Injuries? A Systematic Review. Int J Sports
      Phys Ther 13(6):931-942.
    doi: 10.26603/ijspt20180931
    states: 'Systematic review: ''compiled evidence for an association between change in training load
      and running-related injury does not exist.'''
    verified: crossref
  - citation: 'Ramskov D, Rasmussen S, Sorensen H, Parner ET, Lind M, Nielsen RO (2018). Progression in
      Running Intensity or Volume and Specific Injuries: Run Clever, a Randomized Trial. J Orthop Sports
      Phys Ther 48(10):740-748.'
    doi: 10.2519/jospt.2018.8062
    states: RCT testing intensity- vs. volume-based progression rules found neither prevented running
      injuries better than the other.
    verified: crossref
- name: first_week_fit
  family: periodisation
  reading: first_week_fit
  reads: week-1 hours over the athlete's recent weekly hours
  grade: D
  goals:
  - running_marathon
  - half_ironman
  - ironman
  band:
    low: 0.7
    high: 1.15
  ramp: 0.3
  school_specific: false
  sources:
  - citation: Nielsen RO, Parner ET, Nohr EA, Sorensen H, Lind M, Rasmussen S (2014). Excessive Progression
      in Weekly Running Distance and Risk of Running-Related Injuries. J Orthop Sports Phys Ther 44(10):739-747.
    doi: 10.2519/jospt.2014.5164
    states: The injury signal in this cohort was strongest for runners whose distance jumped sharply relative
      to their own recent baseline, not for any absolute volume.
    verified: crossref
  - citation: Friel J (2024). The Triathlete's Training Bible (5th ed). VeloPress. ISBN 9781646046072.
    isbn: '9781646046072'
    states: A new training block should start at or just below the athlete's current fitness/volume, not
      below it enough to waste weeks, nor above it.
    verified: isbn
- name: first_long_session_fit
  family: periodisation
  reading: first_long_session_fit
  reads: first long run or ride over the athlete's longest recent one, worst of the two; not the swim, whose first session the pool sets and whose evidence is running cohorts
  grade: B
  goals:
  - running_marathon
  - half_ironman
  - ironman
  - trail_20k
  band:
    low: 0.8
    high: 1.15
  ramp: 0.3
  school_specific: false
  note: A 5,200-runner cohort found the single session over the athlete's recent longest was the one load
    metric that predicted injury, with 10 to 30 percent spikes already elevated; one cohort, so the pooled
    caution of Damsted 2018 stands.
  sources:
  - citation: 'Buist I, Bredeweg SW, van Mechelen W, Lemmink KAPM, Pepping GJ, Diercks RL (2008). No Effect
      of a Graded Training Program on the Number of Running-Related Injuries in Novice Runners: A Randomized
      Controlled Trial. Am J Sports Med 36(1):33-39.'
    doi: 10.1177/0363546507307505
    states: 'RCT: a 13-week ''graded'' (~10%-rule) program showed no injury-rate reduction vs. an 8-week
      standard program.'
    verified: crossref
  - citation: Nielsen RO, Parner ET, Nohr EA, Sorensen H, Lind M, Rasmussen S (2014). Excessive Progression
      in Weekly Running Distance and Risk of Running-Related Injuries. J Orthop Sports Phys Ther 44(10):739-747.
    doi: 10.2519/jospt.2014.5164
    states: 'Cohort: >30% increase in weekly distance over 2 weeks raised risk for some (not all) injury
      types; risk did not rise linearly below that.'
    verified: crossref
  - citation: Damsted C, Glad S, Nielsen RO, Sorensen H, Malisoux L (2018). Is There Evidence for an Association
      Between Changes in Training Load and Running-Related Injuries? A Systematic Review. Int J Sports
      Phys Ther 13(6):931-942.
    doi: 10.26603/ijspt20180931
    states: 'Systematic review: ''compiled evidence for an association between change in training load
      and running-related injury does not exist.'''
    verified: crossref
  - citation: 'Ramskov D, Rasmussen S, Sorensen H, Parner ET, Lind M, Nielsen RO (2018). Progression in
      Running Intensity or Volume and Specific Injuries: Run Clever, a Randomized Trial. J Orthop Sports
      Phys Ther 48(10):740-748.'
    doi: 10.2519/jospt.2018.8062
    states: RCT testing intensity- vs. volume-based progression rules found neither prevented running
      injuries better than the other.
    verified: crossref
  - citation: Frandsen JSB, Hulme A, Parner ET, et al. (2025). How much running is too much? Identifying
      high-risk running sessions in a 5200-person cohort study. Br J Sports Med 59(17):1203-1210.
    doi: 10.1136/bjsports-2024-109380
    verified: crossref
    states: Only a session's distance over the athlete's longest run of the prior 30 days predicted injury;
      10 to 30 percent spikes carried a hazard ratio near 1.6.
- name: peak_weekly_hours
  family: periodisation
  reading: peak_weekly_hours
  reads: hours of the biggest training week, race week excluded
  grade: B
  goals:
  - half_ironman
  - ironman
  - trail_50k
  band:
    by_goal:
      ironman:
        by_tier:
          basic:
            low: 10.0
            high: 14.0
          moderate:
            low: 12.0
            high: 16.0
          competitive:
            low: 14.0
            high: 18.0
        why: 'Weekly hours by athlete level (tlc §4): recreational 10-14, competitive age-group 14-18,
          moderate between them.'
      half_ironman:
        by_tier:
          basic:
            low: 8.0
            high: 12.0
          moderate:
            low: 11.0
            high: 15.0
          competitive:
            low: 14.0
            high: 18.0
        why: 4 h bands floored just below each tier's peaks; a top-tier 70.3 build trains about
          the hours of a full-distance one (tlc §8).
      trail_50k:
        by_tier:
          basic:
            low: 5.0
            high: 7.0
          moderate:
            low: 7.0
            high: 9.0
          competitive:
            low: 9.0
            high: 12.0
        why: The trail research's peak weekly hours for a 50K, by tier, anchored on two coaches' floors.
        evidence: tr §13.4, trail 50K row. The floors are Torrence's 4-6 h/wk first 50K and the CTS 6
          h/wk peak block (tr §3.2, §4.1); the split into tiers is the research document's own [EX] imposition.
  ramp: width
  school_specific: false
  note: The marathon has no tiered literature band and is reported as a fact.
  sources:
  - citation: Sinisgalli R, de Lira CAB, Vancini RL, Puccinelli PJ, Hill L, Knechtle B, Nikolaidis PT
      & Andrade MS (2021). Impact of training volume and experience on amateur Ironman triathlon performance.
      Physiol Behav, 232, 113344.
    doi: 10.1016/j.physbeh.2021.113344
    states: 99 amateur Ironman finishers trained 9-20 h/week pre-race; more than ~14 h/week showed no
      extra performance benefit.
    verified: crossref
  - citation: Knechtle B, Wirth A, Baumann B, Knechtle P, Rosemann T & Senn O (2010). Differential Correlations
      Between Anthropometry, Training Volume, and Performance in Male and Female Ironman Triathletes.
      J Strength Cond Res.
    doi: 10.1519/JSC.0b013e3181c643b6
    states: 27 male and 16 female amateur Ironman finishers averaged 14.8 h/week and 13.9 h/week training,
      respectively.
    verified: crossref
  - citation: Vickers AJ & Vertosick EA (2016). An empirical study of race times in recreational endurance
      runners. BMC Sports Sci Med Rehabil, 8, 51.
    doi: 10.1186/s13102-016-0052-y
    states: '2,303 recreational runners: weekly training mileage was strongly and independently associated
      with race time at all distances, including marathon.'
    verified: crossref
  - citation: Friel J (2024). The Triathlete's Training Bible (5th ed). VeloPress. ISBN 9781646046072.
    isbn: '9781646046072'
    states: 'Peak weekly hours scale with athlete level: recreational lowest, competitive age-group highest,
      for both half- and full-distance racing.'
    verified: isbn
  - citation: Dixon M (2017). Fast-Track Triathlete. VeloPress. ISBN 9781937715748.
    isbn: '9781937715748'
    states: Time-efficient Ironman preparation is workable at roughly 10-14 h/week peak for busy age-groupers,
      at the low end of the recreational tier.
    verified: isbn
- name: taper_duration
  family: taper
  reading: taper_duration_days
  reads: days of taper-and-race-labelled weeks before race day
  grade: B
  goals:
  - running_marathon
  - half_ironman
  - ironman
  band:
    low: 8
    high: 21
  ramp: 7.0
  school_specific: false
  sources:
  - citation: Mujika I, Padilla S (2003). Scientific Bases for Precompetition Tapering Strategies. Med
      Sci Sports Exerc 35(7):1182-1187.
    doi: 10.1249/01.MSS.0000074448.73931.11
    states: Reviews taper studies converging on ~2-week (8-14 day) tapers as typical/optimal for most
      events.
    verified: crossref
  - citation: Mujika I (2009). Tapering and Peaking for Optimal Performance. Human Kinetics.
    isbn: 978-0-7360-7484-1
    states: Synthesises the 8-14 day convention and extends it to up to 3 weeks (21 days) for Ironman-distance
      events.
    verified: isbn
  - citation: 'Wang Z, Wang Y, Gao W, Zhong Y (2023). Effects of tapering on performance in endurance
      athletes: a systematic review and meta-analysis. PLOS ONE 18(5):e0282838.'
    doi: 10.1371/journal.pone.0282838
    states: 2023 update pools taper studies; duration is a moderator but no single day-count is shown
      superior within the 4-28 day range studied.
    verified: crossref
- name: taper_volume_drop
  family: taper
  reading: taper_volume_drop
  reads: mean taper-week hours over the peak load week; a one-week taper is read together with its
    race week
  grade: D
  band:
    low: 0.5
    high: 0.7
    why: Fallback for goals without their own band, extrapolated from the full-distance taper; the wide
      ramp keeps shallower goals rankable.
    by_goal:
      trail_20k:
        low: 0.4
        high: 0.6
        why: 'The two taper reviews'' optimum, retaining 40 to 59 percent of the peak week over the whole
          taper: with one taper week the reading is the mean of that week and race week, which the long-course bands (taper weeks alone) do not describe.'
        evidence: 'Measured 2026-10-06 on the trail 20K basic plans: 0.45-0.60 at 12-20 weeks for athletes
          at 0.75-1.5 of the default volume.'
      ironman:
        low: 0.5
        high: 0.7
        why: Round edges inside a 0.50-0.75 spread, so a plan that never really tapers still fires.
      half_ironman:
        low: 0.4
        high: 0.94
        why: 'Half-distance tapers (nine days to two weeks) are held at 0.55-0.94 of the peak week
          in their taper weeks alone, the maintainer''s range. A half plan with one taper week is read with its race week, a mean
          the taper-week bands do not describe, so the floor is the taper trials'' optimum: a 41 to 60
          percent cut over the whole taper, retaining 0.40 (since 2026-10-11; 0.55 before).'
      running_marathon:
        low: 0.58
        high: 0.64
        why: Marathon tapers keep the taper mean far shallower than a deep cut.
      running_half_marathon:
        low: 0.4
        high: 0.6
        why: 'The two taper reviews'' optimum, retaining 40 to 59 percent of the peak week over the whole
          taper, as for the trail 20K: with one taper week the reading is the mean of that week and race
          week, which the full-distance fallback (taper weeks alone) does not describe.'
        evidence: 'Measured 2026-11-09 on the half-marathon moderate plans: 0.43-0.52 at 8-24 weeks for
          athletes at 0.85-1.5 of the default volume.'
  ramp: 0.4
  missing: 1.0
  school_specific: false
  note: 'The direction is the taper trials'': Bosquet''s optimum is a 41 to 60 percent cut. Real tapers run shallower, so the grade is the bands'' and not the trials''.
    The cut is the whole taper''s mean and the bands describe two- and three-week tapers, so a
    one-week taper is read with its race week (since 2026-10-06; before that the week two weeks out
    was graded alone against them).'
  sources:
  - citation: 'Bosquet L, Montpetit J, Arvisais D, Mujika I (2007). Effects of Tapering on Performance:
      A Meta-Analysis. Med Sci Sports Exerc 39(8):1358-1365.'
    doi: 10.1249/mss.0b013e31806010e0
    states: Meta-analytic optimum is a 41-60% volume reduction (i.e., retaining ~40-59% of peak), the
      single most robust taper finding in the literature.
    verified: crossref
  - citation: Mujika I, Padilla S (2003). Scientific Bases for Precompetition Tapering Strategies. Med
      Sci Sports Exerc 35(7):1182-1187.
    doi: 10.1249/01.MSS.0000074448.73931.11
    states: Independently converges on 40-60% volume reduction across the tapering studies it reviews.
    verified: crossref
- name: taper_session_frequency
  family: taper
  reading: taper_session_frequency
  reads: mean taper-week sessions over peak-week sessions
  grade: A
  band:
    low: 0.8
    high: 1.5
  ramp: 0.3
  missing: 1.0
  school_specific: false
  note: 'The evidence is for keeping the frequency, not against a taper with a session more than the
    peak week: a small athlete''s peak week can hold one run fewer than the taper (the fourth run goes
    optional), which read 1.33 against a 1.2 ceiling (2026-10-11; the ceiling was 1.2). The ceiling
    still fires on a taper that adds sessions wholesale.'
  sources:
  - citation: 'Bosquet L, Montpetit J, Arvisais D, Mujika I (2007). Effects of Tapering on Performance:
      A Meta-Analysis. Med Sci Sports Exerc 39(8):1358-1365.'
    doi: 10.1249/mss.0b013e31806010e0
    states: Maintained training frequency carried its own significant effect size (0.35 +/- 0.17, p<0.001)
      independent of the volume cut.
    verified: crossref
- name: taper_intensity_kept
  family: taper
  reading: taper_intensity_kept
  reads: mean quality-session minutes at zone 3 and up per taper week over the peak load week's; a quality
    session spends at least a third of its time at zone 3 or above
  grade: A
  goals:
  - running_marathon
  - half_ironman
  - ironman
  band:
    low: 0.4
    high: 1.05
  ramp: 0.4
  missing: 1.0
  school_specific: false
  note: 'The taper trials held the pace and power of the remaining quality work while volume fell around
    it, so the reading counts only quality sessions and leaves out the race-pace minutes inside long sessions,
    which the taper is meant to cut. The floor is the volume rule''s: quality minutes may fall as far as
    the trials cut volume, a 41 to 60 percent cut, and no further (since 2026-10-11; 0.5 before).'
  sources:
  - citation: 'Bosquet L, Montpetit J, Arvisais D, Mujika I (2007). Effects of Tapering on Performance:
      A Meta-Analysis. Med Sci Sports Exerc 39(8):1358-1365.'
    doi: 10.1249/mss.0b013e31806010e0
    states: Maintained intensity carried a significant effect size (0.33 +/- 0.14, p<0.001) on its own,
      independent of the volume cut.
    verified: crossref
  - citation: Mujika I, Padilla S (2003). Scientific Bases for Precompetition Tapering Strategies. Med
      Sci Sports Exerc 35(7):1182-1187.
    doi: 10.1249/01.MSS.0000074448.73931.11
    states: Reduce volume, not intensity — dropping intensity accelerates detraining of neuromuscular
      and metabolic adaptations.
    verified: crossref
  - citation: Shepley B, MacDougall JD, Cipriano N, Sutton JR, Tarnopolsky MA, Coates G (1992). Physiological
      effects of tapering in highly trained athletes. J Appl Physiol 72(2):706-711.
    doi: 10.1152/jappl.1992.72.2.706
    verified: crossref
    states: 'Seven-day tapers in trained runners: the high-intensity, low-volume taper kept race-pace
      repeats and improved performance most.'
  - citation: Houmard JA, Scott BK, Justice CL, Chenier TC (1994). The effects of taper on performance
      in distance runners. Med Sci Sports Exerc 26(5):624-631.
    doi: 10.1249/00005768-199405000-00016
    verified: crossref
    states: An 85 percent volume cut with interval sessions kept at intensity improved 5 km performance.
  - citation: Neary JP, Bhambhani YN, McKenzie DC (2003). Effects of different stepwise reduction taper
      protocols on cycling performance. Can J Appl Physiol 28(4):576-587.
    doi: 10.1139/h03-044
    verified: crossref
    states: Cyclists' tapers cutting volume by 30, 50 or 80 percent at maintained intensity; the 50 percent
      cut performed best.
- name: taper_shape
  family: taper
  reading: taper_shape
