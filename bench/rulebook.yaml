schools:
- school: Traditional / Matveyev-Friel linear periodization
  source: 'Bompa TO, Haff GG (2009). Periodization: Theory and Methodology of Training (5th ed.). Human
    Kinetics. ISBN 978-0-7360-7483-4.'
  departs_on:
  - Base phase near-zero VO2max/intensity (vo2max_in_base)
  - Sequential single-emphasis phases (Base -> Build -> Peak), not concentrated blocks
  - 3:1 or 2:1 load:recovery cadence (recovery_cadence)
- school: Daniels (VDOT / pace-zone system)
  source: Daniels J (2021). Daniels' Running Formula (4th ed.). Human Kinetics. ISBN 978-1-718-20366-2.
  departs_on:
  - Caps Interval-pace (I-pace, ~zone 5) volume at ~8% of weekly mileage regardless of phase, a volume
    cap rather than a session count
  - Threshold (T-pace) work is a distinct, larger allocation than Friel's threshold zone, run near cruise-interval
    structure
  - Long run capped near 25-30% of weekly mileage, not a fixed clock duration
- school: Lydiard
  source: Lydiard A, Gilmour G (2011 reissue). Running to the Top. Meyer & Meyer. ISBN 978-1-84126-335-9.
  departs_on:
  - Very long (weeks-long) pure-aerobic base phase before any anaerobic work is introduced at all — an
    extreme version of vo2max_in_base's base=0 rule
  - Hill resistance-training block bridges base and anaerobic phases, a structural stage most other schools
    do not name separately
  - Short, sharp anaerobic/sharpening phase immediately pre-race, deliberately brief relative to the base
    phase's length
- school: Hudson (adaptive/nonlinear periodization)
  source: Hudson B, Fitzgerald M (2008). Run Faster from the 5K to the Marathon. Broadway Books. ISBN
    978-0-7679-2822-9.
  departs_on:
  - Blends intensities within every week from day one (no sequential base-then-intensity phase structure),
    closer to reverse/concurrent periodization than Friel/Matveyev
  - Individualizes phase length and emphasis session-by-session based on athlete response rather than
    a fixed macrocycle template
  - Introduces race-pace and VO2max-adjacent work earlier than classical base-first schools
- school: Maffetone / MAF (aerobic-threshold method)
  source: Maffetone P (2010). The Big Book of Endurance Training and Racing. Skyhorse. ISBN 978-1-60094-345-0.
  departs_on:
  - Prescribes an extended (often many-week) phase of exclusively sub-aerobic-threshold (MAF 180-formula
    HR cap) training with zero zones 3-5 work, far longer and stricter than a conventional BASE phase
  - Uses a fixed formula (180 minus age, with adjustments) for the aerobic ceiling rather than lab-tested
    LT1/LT2
  - Reintroduces speed/anaerobic work only in a short pre-race phase, similar in spirit to Lydiard but
    with a stricter, formula-based low-end cap
- school: Magness (physiological/systems approach)
  source: Magness S (2014). The Science of Running. Origin Press. ISBN 978-0-615-94294-0.
  departs_on:
  - Frames periodization around specific physiological systems (VO2max, LT, running economy, anaerobic
    capacity) trained in sequence with explicit rationale per block, closer to block periodization (Issurin)
    than classical phase-first
  - Emphasizes neuromuscular/economy work (strides, hill sprints, plyometrics) as a continuous thread
    across all phases rather than a base-phase-only inclusion
  - More skeptical of a single fixed TID ratio, favoring phase- and athlete-specific targets over a universal
    80/20 or pyramidal number
- school: Reverse periodization (triathlon-specific variant)
  source: Practitioner convention described in Friel J & Byrn G (2009). Going Long (2nd ed.). VeloPress.
    ISBN not checked.; commonly attributed to indoor-trainer-era
    winter-intensity, summer-volume programs.
  departs_on:
  - Places VO2max/anaerobic-power work in BASE (often the winter off-season, when outdoor long-volume
    riding is impractical) and shifts to aerobic volume as BUILD/PEAK approaches race day — a direct inversion
    of vo2max_in_base's base=0 band
  - Common in time-crunched age-group triathlon coaching where winter access to long outdoor rides is
    limited, less common for pure marathon training
  - Peak-phase intensity is lower/more volume-dominant than classical schools, since the anaerobic stimulus
    was already banked earlier
