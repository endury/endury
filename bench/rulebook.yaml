      J Sports Physiol Perform 13(9):1114-1121.'
    doi: 10.1123/ijspp.2017-0327
    states: Reviews studies in marathon-adjacent distance runners; pyramidal distribution is the more
      commonly observed pattern in elite marathon training than polarised.
    verified: crossref
  - citation: 'Casado A, González-Mohíno F, González-Ravé JM, Foster C (2022). Training periodization,
