  peak/load:
    contract:
      must_not_contain: [run_10k_race_pace, run_5k_race_pace]
      bricks_per_week: [1, 1]
    slots:
      - name: him_peak_wed_long_run
        day: wed
        activity: run_long_progression
        minutes: {basic: [95, 100]}
        progression: him_long_run
        key: 0.3
        # intent: 2026-09-29 a key session (R-SESS-033), so a squeezed PEAK
        # week keeps its long run and shrinks the others: half-volume joins
        # lost it from 6 of 210 PEAK load weeks. 0.3 sits above the largest
        # share it took of a PEAK week across the measured grid (0.26, median
        # 0.15), so it binds only in a squeezed week.
        # intent: Longest run of the plan. Per-tier rather than scaled() for the
        # same reason the long swim is: tlc §4's Long Session Benchmarks table
        # (half run 1.5-2 h) is stated per DISTANCE, not per ambition — the race
        # is the same length for everyone, and the slower athlete is out there
        # longer. scaled(120, 120) gave
        # BASIC 78 min, under
        # the 1.5 h floor. COMPETITIVE is fixed at 125: with [120, 125] the QP
        # trimmed the later peak weeks to 120, so the plan's longest run fell
        # five weeks out.
        why: >-
          The longest run of your plan, finishing at a real effort. From here
          the running gets shorter, not longer — this is the run durability you
          will spend on race day.
      - name: him_peak_sat_bike_race_pace
        day: sat
        activity: bike_long_him_race_pace
        minutes: {basic: [180, 200], moderate: [185, 205]}
        progression: him_long_bike
        # intent: The 70.3 race-pace rehearsal ride. tlc §6 gives the half PEAK
        # bike as 'race-pace long rides', and §5 spells the difference from
        # Ironman out: 'a 3-hour bike at 78-82% FTP rather than a 5-hour ride at
        # 68-72%'. This slot rode plain BIKE_LONG until 2026-07-28, so no half
        # plan prescribed a race-pace ride at all and race_pace_long_bike_peak
        # read a structural 1.000 — the Ironman menus have carried
        # BIKE_LONG_IM_RACE_PACE in PEAK since the durability fix. Same day,
        # same HIM_LONG_BIKE ramp; the effort and the tier floors change.
        # Per-tier rather than scaled() on the tlc §4 benchmark argument (half
        # bike 3-4 h, stated per distance, not per ambition): scaled(200, 240)
        # gave BASIC a 2.17 h longest ride, under that band.
        why: >-
          The dress rehearsal on the bike. A half-distance race is ridden hard — a shorter
          ride at a genuinely strong effort, not a long easy cruise — so this is
          where the long ride is done at the effort you plan to race at,
          fuelling and position included.
      - name: him_peak_sat_brick
        day: sat
        activity: run_brick_him_tempo
        minutes: {basic: [38, 44], moderate: [42, 48]}
        brick: true
        # intent: The PEAK brick IS the race rehearsal. tri.md §4 periodises
        # bricks BASE (short transition runs) -> BUILD (20-40 min at progressive
        # intensity) -> PEAK (race-simulation: race-duration bike + race-pace
        # run), and tlc §6 spells the half out: 'PEAK brick sessions are at
        # half-Ironman race pace'. This slot ran RUN_BRICK_SHORT at 16-38 min
        # until 2026-08-25 — easy family, and SHORTER than the late-BUILD
        # RUN_BRICK_HIM_TEMPO brick (33-44 min) it is supposed to escalate.
        # Every other family in the half menus climbs BUILD -> PEAK; the brick
        # alone went backwards in both duration and intensity. The PEAK-phase brick run
        # now escalates over the BUILD brick.
        # 2026-08-27 (half-IM panel, 6 findings): re-chained
        # from Sunday's endurance spin to SATURDAY's race-pace long ride —
        # tri.md §4's PEAK brick is race-duration bike + race-pace run as ONE
        # session, and the old placement rehearsed running off the wrong ride.
        # Bounds stay conservative for now; raising them is a separate step.
        why: >-
          Race rehearsal: run off the bike at the effort you intend to race.
          This is the sharpest test of whether your bike pacing leaves you a run
          leg at all, and now is the last point in the plan where finding that
          out is still useful.
      - name: him_comp_peak_sun_bike_race_pace
        day: sun
        activity: bike_long_him_race_pace
        minutes: {competitive: [190, 210]}
        progression: him_long_bike
        why: >-
          The dress rehearsal on the bike. A half-distance race is ridden hard — a shorter
          ride at a genuinely strong effort, not a long easy cruise — so this is
          where the long ride is done at the effort you plan to race at,
          fuelling and position included.
      - name: him_comp_peak_sun_brick
        day: sun
        activity: run_brick_him_tempo
        minutes: {competitive: [45, 52]}
        brick: true
        why: >-
          Race rehearsal: run off the bike at the effort you intend to race.
          This is the sharpest test of whether your bike pacing leaves you a run
          leg at all, and now is the last point in the plan where finding that
          out is still useful.
      - name: him_peak_fri_swim_long
        day: fri
        activity: swim_long
        metres: {basic: [2050, 2200], moderate: [2500, 3200], competitive: [2900, 3200]}
        progression: him_long_swim
        # intent: The race-distance familiarisation swim (R-SESS-B-006). tlc §4
        # puts the longest half swim at 3,000-3,500 m; the band reaches down to 2,000 m.
        # Until 2026-07-28 both Friday
        # 'swim_long' slots prescribed SWIM_ENDURANCE (easy family), so no half
        # plan carried a LONG-family swim at all and BASIC peaked at 1,800 m —
        # under the 1.9 km race distance.
        why: >-
          The longest swim of your plan, built up toward the 1.9 km you will
          race, so little about the swim leg is new on race morning — the
          distance, the pacing, and the wetsuit if you will be wearing one.
      # The tier signal moved here when the two long slots above became
      # benchmark-driven. COMPETITIVE peaked at 11.2 h against a 12-16 h band
      # (tlc §4 "Weekly Hours by Level"). The added volume is
      # aerobic and lands on the second weekend ride and the brick, where it
      # costs the least: no long-session benchmark moves, and the sessions
      # the taper mirrors keep their shape.
      #
      # 2026-07-29: that fix stopped at the old band's 12.0 h floor —
      # COMPETITIVE landed at 12.03 h and read 0.000. COMPETITIVE only:
      # MODERATE now peaks at 11.2-11.5 h and BASIC at 9.3-9.8 h, both inside their
      # tier's band.
      #
      # 2026-09-25: COMPETITIVE overshot. Its PEAK weeks sat 20-24 % above
      # the last BUILD week (12.3 -> 15.3-15.6 h, ~720 -> ~900 TSS) and the
      # 16-week plan entered its taper at -31.9 combined form a day, under
      # the -30 floor, where it should reach
      # its peak volume by a steady ramp. This ride
      # came down 145-180 -> 120-150 and the Thursday ride below 60-80 ->
      # 45-60, which now starts in late BUILD: the step into PEAK is 8-11 %,
      # form bottoms at -28.4, and PEAK stays the plan's biggest block at
      # 14.4-14.9 h, two weeks out, with ~7.2 h of cycling.
      - name: him_peak_sun_bike_endurance
        day: sun
        activity: bike_endurance
        minutes: {basic: [59, 78]}
        why: >-
          The second weekend ride, kept aerobic. It carries volume without
          competing with Saturday's race-rehearsal day, and it gives Sunday a
          purely easy spin to absorb it.
      - name: him_peak_thu_run_hm_pace
        day: thu
        activity: run_hm_pace
        rotation: [run_hm_pace, run_tempo]
        minutes: {basic: [29, 36]}
        why: >-
          A shorter dose of race-effort running, alternating between half-marathon
          effort and a steady tempo block, to keep your race pace sharp while the long
          weekend sessions take most of the week's load.
      # COMPETITIVE's midweek ride. The tier's peak-week cycling ran 6.18 h, too
      # little for its volume. It cannot come out of Saturday:
      # BIKE_LONG_HIM_RACE_PACE is capped at 3.5 h by
      # race_pace_long_bike_peak's 2.5-3.5 h band, and a 3.5 h ride at
      # 78-82% FTP (tlc §5) is already hard, so the extra volume has to be aerobic
      # and it has to go somewhere else. Since 2026-10-05 it also carries the Sunday ride
      # it replaced (Sunday holds the long run), hence 100-135 min.
      - name: him_peak_thu_bike_endurance
        day: thu
        activity: bike_endurance
        minutes: {competitive: [100, 135]}
        why: >-
          An easy midweek ride. At this level of training the bike is where
          additional volume belongs: it adds fitness without adding pounding to
          your legs, and it keeps the weekend for the race-pace ride and the
          long run.
      - name: him_peak_wed_swim_css
        day: wed
        activity: swim_css
        rotation: [swim_css, swim_threshold]
        metres: {basic: [1500, 1500], moderate: [1800, 1912]}
        # intent: swim_css (400 m warm-up) at every tier: the swim floor
        # (1500/1800/2000 m by tier, R-SESS-039) puts every load and taper swim
        # past the 1400 m where its set holds 8+ min at CSS. swim_css_short
        # (200 m warm-up) stays in the recovery weeks, which carry no floor.
        why: >-
          Race-pace swim work, alternating between short and longer repeats at your
          sustainable pace. The swim is the shortest part of your day, so the aim is to
          reach the bike having swum efficiently rather than heroically.
      - name: him_peak_tue_bike_threshold
        day: tue
        activity: bike_threshold
        rotation: [bike_threshold, bike_over_under, bike_sweet_spot]
        minutes: {basic: [57, 61], moderate: [66, 74], competitive: [68, 73]}
        # intent: The 70.3 bike-threshold dose, authored on the activity's rep
        # lattice so the prescription and the card agree. tlc §2 makes threshold
        # fitness the primary performance determinant for the half, and §6 gives
        # '2x20 min threshold on the bike' as what separates a 70.3 build from
        # an Ironman one; the realized dose therefore ramps BASE 2x8-12.5 ->
        # BUILD 2x10-16.5 -> PEAK 2x12-20 across the tiers, and the taper holds
        # within one step of PEAK (Bosquet 2007: volume falls, intensity is
        # held). Every half slot was authored under the shape's 2x8 min / 49 min
        # floor until 2026-08-25, so all four phases clamped to the identical
        # pattern at BASIC and MODERATE.
        # intent: Over-unders (2026-09-30): 3 x (2 min just under, 1 min just over
        # threshold) per rep, the classic way to train holding power while clearing
        # the fatigue a surge leaves.
        why: >-
          Sustained work near your threshold on the bike, rotating with over-unders that
          swing either side of it and longer sweet-spot blocks a notch below it. The
          half is raced right up against that boundary, so the power you can hold for an
          hour is the power you race on.
      - name: him_peak_tue_swim_drill
        day: tue
        activity: swim_drill
        metres: {basic: [812, 1138], moderate: [1500, 1800]}
        why: >-
          A technique swim in the hardest weeks of the plan. Tired swimming is
          sloppy swimming, and this is the session that keeps your stroke
          honest.
      - name: him_mod_peak_fri_run_easy
        day: fri
        activity: run_easy
        minutes: {moderate: [50, 70]}
        # intent: The peak week's aerobic running (the maintainer:
        # a moderate peak may reach 14 hours); the hour sits on the easy run,
        # not on the quality sessions.
        why: >-
          A fourth easy run in the week. Run frequency, rather than any single
          hard session, is what builds a run leg that holds together off the
          bike — and the run is where most strong cyclists lose their race. It
          shares the week's easy swim day, clear of the hard sessions, and
          should feel genuinely easy.
      - name: him_peak_fri_run_easy
        day: fri
        activity: run_easy
        minutes: {basic: [34, 42], competitive: [62, 76]}
        # intent: The fourth weekly run. Aerobic support beside the easy long
        # swim, carrying run frequency rather than a quality stimulus — em §3's
        # frequency-before-duration ordering for the limiting discipline, and
        # the 70.3 run split is where a bike-strong age-grouper loses most time.
        # Half menus ran three sessions a week at every tier until 2026-07-29.
        why: >-
          A fourth easy run in the week. Run frequency, rather than any single
          hard session, is what builds a run leg that holds together off the
          bike — and the run is where most strong cyclists lose their race. It
          shares the week's easy swim day, clear of the hard sessions, and
          should feel genuinely easy.
      # MODERATE week since 2026-10-09 (see the header); Saturday's ride and
      # brick are the shared slots above.
      - name: him_mod_peak_wed_run_hm_pace
        day: wed
        activity: run_hm_pace
        rotation: [run_hm_pace, run_threshold]
        minutes: {moderate: [44, 56]}
        # intent: Threshold intervals, not a continuous tempo block: at 50-56
        # minutes a tempo run would hold 30-36 minutes just under threshold
        # pace, which is a race, not a session.
        why: >-
          Your midweek race-effort run, alternating a continuous block at
          half-marathon effort with threshold intervals just above it, to keep
          your race pace sharp while the long weekend sessions take most of the
          week's load.
      - name: him_mod_peak_thu_bike_endurance
        day: thu
        activity: bike_endurance
        minutes: {moderate: [75, 120]}
        why: >-
          An easy midweek ride. At this level of training the bike is where
          additional volume belongs: it adds fitness without adding pounding to
          your legs, and it keeps the weekend for the race-pace ride and the
          long run.
      - name: him_mod_peak_sun_long_run
        day: sun
        activity: run_long
        minutes: {moderate: [105, 120]}
        progression: him_long_run
        key: 0.3
        # intent: The plan's longest run, easy, the day after Saturday's
        # race-pace ride and race-effort brick, which already hold the race
        # effort: a progression finish here would stack a second race-effort
        # run on the brick. Keyed for the same reasons as him_peak_wed_long_run.
        why: >-
          The longest run of your plan, kept easy on legs that rode and ran at
          race effort the day before. From here the running gets shorter, not
          longer — this is the run durability you will spend on race day.
      - name: him_comp_peak_tue_swim_css
        day: tue
        activity: swim_css
        rotation: [swim_css, swim_threshold]
        metres: {competitive: [2000, 2250]}
        why: >-
          Race-pace swim work, alternating between short and longer repeats at
          your sustainable pace, beside the quality ride because swimming leaves
          your legs alone. The aim is to reach the bike having swum efficiently
          rather than heroically.
      - name: him_comp_peak_wed_run_hm_pace
        day: wed
        activity: run_hm_pace
        rotation: [run_hm_pace, run_tempo]
        minutes: {competitive: [55, 65]}
        why: >-
          Your midweek race-effort run, alternating between half-marathon effort
          and a steady tempo block, to keep your race pace sharp while the long
          weekend sessions take most of the week's load.
      - name: him_comp_peak_thu_swim_drill
        day: thu
        activity: swim_drill
        metres: {competitive: [1250, 1750]}
        why: >-
          A technique swim in the hardest weeks of the plan. Tired swimming is
          sloppy swimming, and this is the session that keeps your stroke
          honest.
      - name: him_comp_peak_sat_long_run
        day: sat
        activity: run_long
        minutes: {competitive: [125, 125]}
        progression: him_long_run
        key: 0.3
        # intent: The plan's longest run, easy, the day before Sunday's
        # race-pace ride and race-effort brick.
        # Keyed and fixed at 125 for the same reasons as him_peak_wed_long_run.
        why: >-
          The longest run of your plan, kept easy, the day before your race
          rehearsal on the bike. From here the running gets shorter, not
          longer — this is the run durability you will spend on race day.

  # The PEAK recovery week's three rides are authored per tier, not
  # scaled(): tlc §6 sets a recovery week as a FRACTION of the LOAD week it
  # follows (50-60 %), and the PEAK LOAD weeks stopped scaling 0.65/0.85
  # once the long sessions became benchmark-driven — so a scaled() recovery
  # menu drifts further under the floor the lower the tier goes. Measured
  # before this change it held 0.467 (BASIC) / 0.507 (MODERATE) / 0.526
  # (COMPETITIVE) of the preceding LOAD week, all three below tlc's
  # 0.50-0.60, and the BASE recovery weeks' 0.59-0.67 were the only reason
  # recovery_week_depth still read 0.000. The volume goes on the bike for
  # the same reason the phase-scaled recovery menus did in 2026-07-28: it
  # is where it does not push the swim share past the top of its
  # range.
  #
  # 2026-09-25: COMPETITIVE's Thursday and Sunday rides rose (66-82 -> 80-90,
  # 108-130 -> 125-140 min) with the late-BUILD midweek ride. On the 16- and
  # 20-week plans this week opens PEAK straight after the now-bigger BUILD
  # block; at the old bounds it fell to 0.49-0.50 of the load week before
  # it on every horizon, and it holds 0.52-0.54 now.
  peak/recovery:
    slots:
      - name: him_pk_rec_tue_swim
        day: tue
        activity: swim_recovery
        metres: {basic: [812, 1138], competitive: [1250, 1750]}
        why: >-
          An easy technique swim in a lighter week. Recovery weeks keep every
          sport in the week — the volume comes down, the rhythm does not.
      - name: him_mod_pk_rec_tue_swim
        day: tue
        activity: swim_recovery
        metres: {moderate: [1500, 1800]}
        why: >-
          An easy technique swim in a lighter week. Recovery weeks keep every
          sport in the week — the volume comes down, the rhythm does not.
      - name: him_pk_rec_tue_bike
        day: tue
        activity: bike_tempo
        minutes: {basic: [55, 68], moderate: [62, 76], competitive: [66, 81]}
        # intent: The recovery week's bike quality touch: tempo, not
        # sweet spot, so it stays moderate hardness and adds no hard-day
        # stacking.
        why: >-
          A short ride with a controlled tempo section. It is deliberately not a
          hard session — just enough intensity that next week's real work does
          not feel like starting over.
      - name: him_pk_rec_wed_run
        day: wed
        activity: run_easy
        minutes: {basic: [29, 36]}
        why: >-
          An easy run in a lighter week. You get fitter while you absorb hard
          training, not while you do it — keep the effort low and let the last
          block land.
      - name: him_pk_rec_thu_bike
        day: thu
        activity: bike_endurance
        minutes: {basic: [55, 68], competitive: [80, 90]}
        why: >-
          A short easy ride. It keeps the legs turning while the training load
          drops; resist the urge to turn it into a real session.
      - name: him_pk_rec_fri_swim
        day: fri
        # intent: BASIC (975-1300 m) gets swim_css_short (200 m warm-up): at
        # this length swim_css's 400 m warm-up leaves 5x50 m at CSS (5-6.5
        # min), a threshold card without the threshold.
        # MODERATE and COMPETITIVE keep a swim_css set of 1400 m or more.
        # intent: The recovery week's swim quality touch: a short CSS
        # set so the week is not 100% easy-family.
        why: >-
          A short set at your usual hard-swim pace inside an easy week. One
          brief reminder of speed keeps the sharpness you built — the rest of
          the swim, and the week, stays easy.
        variants:
          - activity: swim_css_short
            metres: {basic: [975, 1300]}
          - activity: swim_css
            metres: {moderate: [1500, 1800], competitive: [1500, 2000]}
      - name: him_pk_rec_sat_run
        day: sat
        activity: run_easy
        minutes: {basic: [29, 36]}
        why: >-
          An easy run in a lighter week. You get fitter while you absorb hard
          training, not while you do it — keep the effort low and let the last
          block land.
      - name: him_pk_rec_sun_bike
        day: sun
        activity: bike_endurance
        minutes: {basic: [92, 110]}
        why: >-
          The weekend ride, cut back. It keeps one longer aerobic session in the
          week — the shape you return to next week — at an effort that still
          lets you recover.
      # MODERATE: the load week's shape, lighter (Wednesday ride, Thursday
      # run, Saturday ride, Sunday run); no tests in PEAK.
      - name: him_mod_pk_rec_wed_bike
        day: wed
        activity: bike_endurance
        minutes: {moderate: [62, 76]}
        why: >-
          A short easy ride. It keeps the legs turning while the training load
          drops; resist the urge to turn it into a real session.
      - name: him_mod_pk_rec_thu_run
        day: thu
        activity: run_easy
        minutes: {moderate: [45, 55]}
        why: >-
          An easy run in a lighter week. You get fitter while you absorb hard
          training, not while you do it — keep the effort low and let the last
          block land.
      - name: him_mod_pk_rec_sat_bike
        day: sat
        activity: bike_endurance
        minutes: {moderate: [110, 130]}
        why: >-
          The weekend ride, cut back. It keeps one longer aerobic session in the
          week — the shape you return to next week — at an effort that still
          lets you recover.
      - name: him_mod_pk_rec_sun_run
        day: sun
        activity: run_easy
        minutes: {moderate: [55, 70]}
        why: >-
          The long run, cut back to an easy hour or less. It keeps the Sunday
          rhythm while the week absorbs the training before it.
      # COMPETITIVE: the load week's shape, lighter (Wednesday off, run
      # Saturday, ride Sunday); no tests in PEAK.
      - name: him_comp_pk_rec_thu_run
        day: thu
        activity: run_easy
        minutes: {competitive: [45, 55]}
        why: >-
          An easy run in a lighter week. You get fitter while you absorb hard
          training, not while you do it — keep the effort low and let the last
          block land.
      - name: him_comp_pk_rec_sun_bike
        day: sun
        activity: bike_endurance
        minutes: {competitive: [125, 140]}
        why: >-
          The weekend ride, cut back. It keeps one longer aerobic session in the
          week — the shape you return to next week — at an effort that still
          lets you recover.
      - name: him_comp_pk_rec_sat_run
        day: sat
        activity: run_easy
        minutes: {competitive: [45, 60]}
        why: >-
          The long run, cut back to an easy hour or less. It keeps the Saturday
          rhythm while the week absorbs the training before it.

  # TAPER
  #
  # The PEAK week's own day layout, shrunk. It replaced a
  # five-session week (Mon bike / Tue easy run /
  # Wed recovery swim / Thu strides / Fri swim) that emptied the whole
  # weekend and read 20-25 % of peak volume on 56 % of its sessions with
  # 6-17 % of its quality minutes. Bosquet et al. 2007 isolates the three
  # taper factors: volume is the only one that should fall (frequency
  # 0.35 +/- 0.17 and intensity 0.33 +/- 0.14 each carry their own effect,
  # both p<0.001). So every PEAK slot keeps its
  # day and its sport here; the bike and run long sessions carry the volume
  # cut, and the quality touches (Tue threshold ride, Wed CSS swim, Thu
  # HM-pace run) stay.
  taper/taper:
    slots:
      - name: him_taper_tue_bike_threshold
        day: tue
        activity: bike_threshold
        minutes: {basic: [53, 57], moderate: [58, 63], competitive: [62, 68]}
        # intent: The 70.3 bike-threshold dose, authored on the activity's rep
        # lattice so the prescription and the card agree. tlc §2 makes threshold
        # fitness the primary performance determinant for the half, and §6 gives
        # '2x20 min threshold on the bike' as what separates a 70.3 build from
        # an Ironman one; the realized dose therefore ramps BASE 2x8-12.5 ->
        # BUILD 2x10-16.5 -> PEAK 2x12-20 across the tiers, and the taper holds
        # within one step of PEAK (Bosquet 2007: volume falls, intensity is
        # held). Every half slot was authored under the shape's 2x8 min / 49 min
        # floor until 2026-08-25, so all four phases clamped to the identical
        # pattern at BASIC and MODERATE.
        why: >-
          Threshold work on the bike is the biggest lever on your race, so it
          does not vanish the moment the taper starts. The volume comes out of
          the long weekend rides, not out of this — a short, sharp touch keeps
          the race-day feel while your legs freshen up.
      - name: him_taper_wed_swim_css
        day: wed
        activity: swim_css
        metres: {basic: [1500, 1500], moderate: [1800, 1800]}
        # intent: swim_css (400 m warm-up) at every tier: the swim floor
        # (1500/1800/2000 m by tier, R-SESS-039) puts every load and taper swim
        # past the 1400 m where its set holds 8+ min at CSS. swim_css_short
        # (200 m warm-up) stays in the recovery weeks, which carry no floor.
        why: >-
          A short, crisp swim at race pace. Just enough to keep your feel for
          the water and your pacing, with none of the fatigue.
      - name: him_taper_wed_long_run
        day: wed
        activity: run_long_progression
        minutes: {basic: [65, 68]}
        eases: him_long_run
        # intent: The PEAK long run's progression finish, kept in a run half
        # its length (2026-09-25): with it and the race-pace ride the taper
        # holds about half the peak week's quality minutes (it held 26 % with
        # both easy). 65 min was run_long_progression's card floor (61 min
        # then, 31 now) plus the generator's rounding headroom. 2026-09-29:
        # it eases him_long_run, so it is at most 0.75 of the longest long run
        # booked (R-SESS-034): a small athlete's 37-min PEAK long run was
        # followed by a 55-min taper one.
        why: >-
          Your long run, shorter than at the peak, still finishing a little
          quicker as it did there. The endurance is already in the bank; this
          keeps the pattern and the feel of running strong on tired legs while
          the fatigue drains away.
      - name: him_taper_tue_swim_drill
        day: tue
        activity: swim_drill
        metres: {basic: [650, 812], moderate: [1500, 1500]}
        why: >-
          A short technique swim. Nothing left to gain here, plenty to protect —
          keep the stroke smooth and get out.
      - name: him_taper_thu_run_hm_pace
        day: thu
        activity: run_hm_pace
        minutes: {basic: [26, 29]}
        why: >-
          A short run with race-pace work in the middle. Cutting the length of
          your quality sessions while keeping the intensity is what makes a
          taper work — go easy for two straight weeks and you arrive flat.
      - name: him_taper_fri_swim
        day: fri
        activity: swim_endurance
        metres: {basic: [1500, 1500], moderate: [1800, 1800], competitive: [2000, 2000]}
        why: >-
          An easy steady swim to keep your feel for the water. Effort stays low;
          the work is already done.
      - name: him_taper_sat_bike_long
        day: sat
        activity: bike_long_him_race_pace
        minutes: {basic: [100, 115], moderate: [103, 118]}
        # intent: The ride books its floor (a slot without a progression is
        # step-capped from the 90-minute ramp floor), so the floor is the dose.
        # COMPETITIVE's rose 105 -> 115: its taper read 0.54 of peak, under the
        # 0.55-0.94 band. Race pace, not easy
        # (2026-09-25): the PEAK race-pace ride is most of the peak week's
        # quality, and an easy taper ride kept 26 % of it (Bosquet 2007 and the
        # plan benchmark's taper_intensity_kept: volume falls, intensity holds).
        why: >-
          Your last long ride, much shorter than the ones behind it but still
          partly at race effort. The taper cuts how long you ride, not how
          hard: a shorter ride with its race-pace blocks keeps that effort
          familiar while the fatigue drains away.
      - name: him_mod_taper_sat_brick
        day: sat
        activity: run_brick_him_tempo
        minutes: {moderate: [21, 25]}
        brick: true
        why: >-
          A short run off the bike at race effort. Long enough to remind your
          legs what the transition feels like, short enough to cost you nothing
          on race day.
      - name: him_comp_taper_sun_bike_long
        day: sun
        activity: bike_long_him_race_pace
        minutes: {competitive: [115, 120]}
        why: >-
          Your last long ride, much shorter than the ones behind it but still
          partly at race effort. The taper cuts how long you ride, not how
          hard: a shorter ride with its race-pace blocks keeps that effort
          familiar while the fatigue drains away.
      - name: him_comp_taper_sun_brick
        day: sun
        activity: run_brick_him_tempo
        minutes: {competitive: [23, 27]}
        brick: true
        why: >-
          A short run off the bike at race effort. Long enough to remind your
          legs what the transition feels like, short enough to cost you nothing
          on race day.
      - name: him_taper_sun_bike
        day: sun
        activity: bike_endurance
        minutes: {basic: [36, 46]}
        why: >-
          An easy spin. It keeps the legs moving and your routine intact without
          taking anything out of you.
      - name: him_taper_sun_brick
        day: sun
        activity: run_brick_him_tempo
        minutes: {basic: [19, 23]}
        brick: true
        why: >-
          A short run off the bike at race effort. Long enough to remind your
          legs what the transition feels like, short enough to cost you nothing
          on race day.
      - name: him_taper_fri_run_easy
        day: fri
        activity: run_easy
        minutes: {basic: [25, 30], moderate: [30, 36], competitive: [36, 44]}
        why: >-
          The easy run stays in the week. Dropping sessions outright in a taper
          is what leaves people feeling stale — you keep the rhythm and simply
          do less of each thing.
      - name: him_taper_thu_bike_endurance
        day: thu
        activity: bike_endurance
        minutes: {competitive: [55, 70]}
        # intent: Since 2026-10-05 it also carries the Sunday spin it replaced
        # (Sunday holds the long run).
        why: >-
          A short easy ride, kept in the week so your routine stays the same
          while the hours come down.
      # MODERATE week since 2026-10-09 (see the header); Saturday's brick
      # sits beside the long ride above.
      - name: him_mod_taper_wed_run_hm_pace
        day: wed
        activity: run_hm_pace
        minutes: {moderate: [34, 38]}
        why: >-
          A short run with race-pace work in the middle. Cutting the length of
          your quality sessions while keeping the intensity is what makes a
          taper work — go easy for two straight weeks and you arrive flat.
      - name: him_mod_taper_thu_bike
        day: thu
        activity: bike_endurance
        minutes: {moderate: [45, 60]}
        why: >-
          A short easy ride, kept in the week so your routine stays the same
          while the hours come down.
      - name: him_mod_taper_sun_long_run
        day: sun
        activity: run_long
        minutes: {moderate: [65, 70]}
        eases: him_long_run
        why: >-
          Your long run, shorter than at the peak and easy. The endurance is
          already in the bank; this keeps the Sunday rhythm while the fatigue
          drains away.
      - name: him_comp_taper_tue_swim_css
        day: tue
        activity: swim_css
        metres: {competitive: [2000, 2000]}
        why: >-
          A short, crisp swim at race pace. Just enough to keep your feel for
          the water and your pacing, with none of the fatigue.
      - name: him_comp_taper_wed_run_hm_pace
        day: wed
        activity: run_hm_pace
        minutes: {competitive: [40, 45]}
        why: >-
          A short run with race-pace work in the middle. Cutting the length of
          your quality sessions while keeping the intensity is what makes a
          taper work — go easy for two straight weeks and you arrive flat.
      - name: him_comp_taper_thu_swim_drill
        day: thu
        activity: swim_drill
        metres: {competitive: [1000, 1250]}
        why: >-
          A short technique swim. Nothing left to gain here, plenty to protect —
          keep the stroke smooth and get out.
      - name: him_comp_taper_sat_long_run
        day: sat
        activity: run_long
        minutes: {competitive: [65, 72]}
        eases: him_long_run
        why: >-
          Your long run, shorter than at the peak and easy. The endurance is
          already in the bank; this keeps the Saturday rhythm while the fatigue
          drains away.

  # RACE WEEK (locked durations — scale lock at 1.0 via mode_key="race")
  #
  # The race week is authored per tier on the two rides and the Tuesday
  # run. It used to be one flat layout for all three tiers (3.33 h
  # everywhere), which held race_week_volume inside its 0.27-0.50 band only
  # because every tier peaked between 9 and 12 h. Once COMPETITIVE peaked
  # at ~14.5 h, the flat race week fell to 0.23 of peak, below the band, which scales
  # it: race-week training should read 0.28-0.50 of peak. Every tier now reads
  # 0.32-0.33: MODERATE and COMPETITIVE were lifted on 2026-09-25 (from 0.27
  # and 0.29), when race-day TSB / CTL under the ratio freshness floor read
  # up to 0.44 against the band's 0.27-0.39.
  taper/race:
    slots:
      - name: him_race_tue_run
        day: tue
        activity: run_easy
        minutes: {basic: [35, 35], moderate: [40, 40], competitive: [55, 55]}
        why: >-
