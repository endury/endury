# ironman session menus. Format and validation ladder: AUTHORING.md.
goal: ironman
offered: [moderate]
progressions:
  # intent: Long open-water swim at IF 0.82; race-distance familiarisation.
  - im_long_swim
  # intent: Long-ride progression covering BASE (BIKE_LONG) and BUILD
  # (BIKE_LONG_SWEET_SPOT). Ramp state carries across the activity-key swap at
  # the phase boundary.
  - im_long_bike
  # intent: marathon-leg durability ramp; bike-fatigued legs on Sun. Shared
  # across RUN_LONG and RUN_LONG_PROGRESSION variants.
  - im_long_run
  # intent: Weekday endurance ride; bike volume without weekend stacking.
  - im_midweek_bike
  # intent: Off-the-bike durability run in BUILD. Raises the run-off-bike
  # stimulus from a token 20-25 min to a durability-relevant ~35 min (tri.md §4:
  # BUILD brick 20-40 min). Phase-constant — the sub-75-min running progressive
  # floor holds the nominal at the band top.
  - im_build_brick_run
menus:
  base/load:
    contract:
      must_contain: [bike_long, run_long, swim_long]
      must_not_contain: [run_10k_race_pace, run_5k_race_pace, run_hm_pace]
      bricks_per_week: [0, 1]
    slots:
      - name: base_mon_swim_drill
        day: mon
        activity: swim_drill
        metres: {competitive: [1500, 2250]}
        why: >-
          Swim speed comes from cutting drag, not from adding power, so a
          cleaner body position buys you more than a bigger engine. Drills open
          the week while you are fresh, and they stay in the plan all year
          because stroke quality is the first thing that falls apart when you
          get tired.
      - name: basic_base_tue_bike_hills
        day: tue
        activity: bike_hill_climb
        rotation: [bike_hill_climb, bike_tempo]
        minutes: {basic: [55, 70]}
        window: [0.0, 0.55]
        group: im_basic_base_bike_quality
        # intent: The basic week, the moderate shape (maintainer:
        # "same treatment on every angle"): Monday off, one hard sport per
        # day, a quality ride from the first base week. Base had held no
        # quality at all for 15 weeks and BUILD then raised the load +50 % in
        # one week. Two-way rotations only: BASIC cycles load-load-recovery,
        # and a rotation counts the recovery weeks, so a third member would
        # never show. Hill climbs only in early base, none toward the race.
        why: >-
          Your midweek quality ride, alternating week by week: steady climbs
          just below threshold one week, a continuous tempo block the next.
          Both build the muscular endurance a long bike leg leans on, without
          the hard power that comes later.
      - name: basic_base_tue_bike_tempo
        day: tue
        activity: bike_sweet_spot
        rotation: [bike_sweet_spot, bike_tempo]
        minutes: {basic: [55, 70]}
        window: [0.55, 1.0]
        group: im_basic_base_bike_quality
        # intent: Late-BASE tail of the BASIC Tuesday ride: sweet spot joins,
        # so BUILD's threshold and sweet-spot rides continue a habit.
        why: >-
          Late in base the Tuesday ride firms up, alternating sweet-spot blocks
          just under threshold with a continuous tempo ride, so the build feels
          like a continuation rather than a shock.
      - name: mod_base_tue_bike_climb
        day: tue
        activity: bike_hill_climb
        rotation: [bike_hill_climb, bike_tempo]
        minutes: {moderate: [55, 65]}
        window: [0.0, 0.75]
        group: im_mod_base_bike_quality
        # intent: Within-BASE Tue bike crossover: base cycling is
        # cadence/neuromuscular-drill work (tlc §6, tri.md §3 Base row), so
        # drills own the early window (frac 0-0.75) and hand off to a threshold
        # variant in the back half — seeding the BUILD sub-threshold stimulus as
        # a bridge, not front-loading it.
        # intent: BASE colour (2026-09-30): cadence work alternates with hill climbs,
        # strength endurance just below threshold. They are tempo family, so the
        # long-course base still holds no VO2max work.
        why: >-
          Your midweek quality ride, alternating week by week: a set of steady
          climbs just below threshold one week, a continuous tempo block the
          next. Both build the muscular endurance a long bike leg leans on,
          below the harder work that comes later.
      - name: mod_base_tue_bike_threshold
        day: tue
        activity: bike_threshold
        rotation: [bike_threshold, bike_sweet_spot]
        minutes: {moderate: [55, 65]}
        window: [0.5, 1.0]
        group: im_mod_base_bike_quality
        # intent: Late-BASE tail of the Tue bike crossover: introduces bike
        # threshold, sub-threshold power being the IM performance determinant
        # (tri.md §3), held to the back half so the BUILD stimulus is seeded
        # rather than front-loaded.
        why: >-
          Sustained power just below your limit is what decides a full-distance bike split,
          so it gets introduced towards the end of base rather than dropped on you all
          at once. The ride alternates between threshold intervals and longer sweet-spot
          blocks a notch below them, training the same quality from both sides.
      - name: comp_base_tue_bike_tempo
        day: tue
        activity: bike_hill_climb
        rotation: [bike_hill_climb, bike_tempo]
        minutes: {competitive: [60, 75]}
        window: [0.0, 0.8]
        group: im_base_bike_quality
        # intent: Competitive-dose Tue bike crossover: sub-threshold tempo work
        # owns the early window (frac 0-0.8), crossing to threshold in the back
        # half (tlc §6, tri.md §3 Base row). Hill climbs alternate with a
        # continuous tempo ride, both tempo family, so the long-course base
        # still holds no VO2max work. Reviewed with the maintainer:
        # every base week carries one real quality ride; the cadence-drill
        # weeks held none, and the BUILD step then quadrupled the zone-3+
        # minutes in one week.
        why: >-
          Your midweek quality ride, alternating week by week: a set of steady
          climbs just below threshold one week, a continuous tempo block the
          next. Both build the muscular endurance a long bike leg leans on,
          below the harder threshold work that comes later in base.
      - name: comp_base_tue_bike_threshold
        day: tue
        activity: bike_threshold
        rotation: [bike_threshold, bike_sweet_spot]
        minutes: {competitive: [60, 75]}
        window: [0.55, 1.0]
        group: im_base_bike_quality
        # intent: Tail of the competitive Tue bike crossover: bike threshold
        # from frac 0.55 on, seeding the BUILD sub-threshold determinant late
        # rather than front-loading it (tri.md §3).
        why: >-
          Late in base the Tuesday ride turns into structured work just under threshold,
          the quality a full-distance bike leg is raced on. It alternates between threshold
          intervals and longer sweet-spot blocks, so the build phase feels like a
          continuation rather than a shock.
      - name: comp_base_tue_strides
        day: tue
        activity: run_strides
        minutes: {competitive: [25, 40]}
        window: [0.0, 0.6]
        group: im_comp_base_strides
        # intent: The competitive week, reviewed with the maintainer: one
        # easy day (Monday's swim), three rides in base, and the hard days spread
        # one sport each (Tue bike, Wed run). The strides share Tuesday with the
        # quality ride, so Thursday can carry the third ride
        # (comp_base_thu_bike_easy). From 0.6 the quality swim takes the
        # Tuesday place (2026-10-03) and the strides move to Thursday
        # (comp_base_thu_strides); on Thursday all base, the even daily loads
        # raised the light athlete's base monotony (bench, 2.12 -> 2.32).
        why: >-
          Short, relaxed accelerations keep your legs quick and your form crisp
          in a phase that is otherwise all steady mileage. They share the day
          with the quality ride, which keeps the rest of the week free for easy
          volume.
      - name: comp_base_thu_strides
        day: thu
        activity: run_strides
        minutes: {competitive: [25, 40]}
        window: [0.6, 1.0]
        group: im_comp_base_strides
        why: >-
          Short, relaxed accelerations keep your legs quick and your form crisp
          in a phase that is otherwise all steady mileage. Late in base they
          share the day with an easy spin, so they never meet tired legs.
      - name: base_wed_run_easy
        day: wed
        activity: run_easy
        minutes: {moderate: [45, 65]}
        window: [0.0, 0.55]
        group: im_mod_base_wed_run
        why: >-
          Easy aerobic running is where run durability is actually built, and it
          is the only running volume you can absorb at little recovery cost. Keep it genuinely easy — the hard running arrives later in
          the plan.
      - name: basic_base_wed_run_easy
        day: wed
        activity: run_easy
        minutes: {basic: [40, 60]}
        window: [0.0, 0.55]
        group: im_basic_base_wed_run
        why: >-
          Easy aerobic running is where run durability is actually built, and it
          is the only running volume you can absorb at little recovery cost. Keep it genuinely easy — the harder running arrives later in
          base.
      - name: basic_base_wed_run_tempo
        day: wed
        activity: run_aerobic_tempo
        rotation: [run_aerobic_tempo, run_easy]
        minutes: {basic: [40, 55]}
        window: [0.55, 1.0]
        group: im_basic_base_wed_run
        # intent: Late-BASE BASIC run (2026-10-03): a steady aerobic tempo
        # every other week, easy in between, so BUILD's Wednesday tempo run is
        # not the first firm running of the plan.
        why: >-
          Late in base the midweek run picks up every other week with a steady,
          comfortably firm tempo, and stays easy in between. It gets your legs
          used to working before the build makes it a weekly session.
      - name: comp_base_wed_run_easy
        day: wed
        activity: run_easy
        minutes: {competitive: [50, 75]}
        window: [0.0, 0.55]
        group: im_comp_base_wed_run
        why: >-
          Easy aerobic running is where run durability is actually built, and it
          is the only running volume you can absorb at little recovery cost. Keep it genuinely easy — the harder running arrives later in
          base.
      - name: comp_base_wed_run_tempo
        day: wed
        activity: run_aerobic_tempo
        rotation: [run_aerobic_tempo, run_progression]
        minutes: {competitive: [45, 60]}
        window: [0.55, 1.0]
        group: im_comp_base_wed_run
        # intent: Late-BASE run quality (2026-10-01): a steady aerobic tempo
        # run, so BUILD's threshold and tempo running continues a habit rather
        # than starting cold. Aerobic tempo, not threshold or VO2max: the
        # long-course base holds no VO2max work.
        why: >-
          Late in base the midweek run picks up, alternating a steady,
          comfortably firm tempo with a progression run that builds from easy
          to threshold pace. It gets your legs used to working before the
          build adds harder running.
      - name: mod_base_tue_swim_drill
        day: tue
        activity: swim_drill
        metres: {moderate: [1500, 1800]}
        # intent: On Tuesday since 2026-10-03; at least 1500 m since
        # 2026-11-03, as every pool visit in the half.
        why: >-
          A technique swim. For most triathletes the swim rewards practice far
          more than fitness, and only repetition makes a new stroke habit stick.
          Base is when there is room in the schedule to do it properly.
      - name: basic_base_tue_swim_drill
        day: tue
        activity: swim_drill
        rotation: [swim_drill, swim_pull]
        metres: {basic: [1500, 1750]}
        window: [0.0, 0.55]
        group: im_basic_base_tue_swim
        # intent: BASIC's drill swim moves off Monday (2026-10-03), so Monday
        # is the week's rest day, as in the moderate week; on Tuesday, so the
        # base swims are three days apart (Tuesday and Friday). It alternates
        # with a pull swim: base weeks had
        # repeated one identical easy week after another.
        why: >-
          Swim speed comes from cutting drag, not from adding power, so a
          cleaner body position buys you more than a bigger engine. Drill sets
          alternate week by week with a pull swim, which lets you feel your
          catch while the legs rest for the weekend.
      - name: basic_base_tue_swim_css
        day: tue
        activity: swim_css
        rotation: [swim_drill, swim_css]
        metres: {basic: [1500, 1750]}
        window: [0.55, 1.0]
        group: im_basic_base_tue_swim
        # intent: Late-BASE swim quality every other week (2026-10-03), on the
        # day BUILD keeps it (basic_build_tue_swim_css). The quality swim and
        # the extra pull swim were the largest piece of the BASE -> BUILD step
        # (+46 of +84 TSS in one week); drills keep alternating for the
        # technique this tier needs most. Out of step with the Wednesday tempo
        # run (basic_base_wed_run_tempo), so each late-base week holds one of
        # the two; in step, one week held both and the next neither.
        why: >-
          Late in base the Tuesday swim alternates the drill sets with your
          first repeats at race-relevant pace, so swim fitness starts to grow
          while your technique keeps being worked.
      - name: basic_base_thu_bike_easy
        day: thu
        activity: bike_cadence
        rotation: [bike_cadence, bike_endurance]
        minutes: {basic: [40, 60]}
        progression: im_midweek_bike
        # intent: BASIC base's third ride (2026-10-03), on the midweek-ride
        # progression so it grows into BUILD's Thursday endurance ride
        # instead of BUILD adding a 100-min ride in one week. Cadence drills
        # every other week, in the weeks
        # of Tuesday's low-cadence hill climbs (basic_base_tue_bike_hills).
        why: >-
          An easy ride midweek adds a third ride without adding fatigue,
          alternating week by week between fast-pedalling drills that smooth
          your stroke and a plain steady spin. Riding often is how the bike leg
          becomes routine, and it is the cheapest training time in triathlon.
      - name: comp_base_wed_swim_pull
        day: wed
        activity: swim_pull
        metres: {competitive: [2000, 2000]}
        window: [0.25, 0.6]
        group: im_comp_base_swim_quality
        # intent: Extra competitive pull swim, gated to fire after the first
        # BASE quarter (frac 0.25): swim is over-represented at low injury cost,
        # so the top tier absorbs added pull volume (tri.md §2), sustaining the
        # drill/technique work that must hold every phase since technique
        # degrades under fatigue (tri.md §3). Late BASE hands it to the
        # Tuesday CSS swim (comp_base_tue_swim_css, 2026-10-01).
        why: >-
          Pull work loads your upper body and lets you feel your catch without
          the legs bailing you out. Swimming is the cheapest place in the plan
          to add volume — your body absorbs it at almost no recovery cost — so an
          extra swim goes in once base is properly underway.
      - name: comp_base_thu_bike_easy
        day: thu
        activity: bike_endurance
        minutes: {competitive: [45, 75]}
        progression: im_midweek_bike
        # intent: The competitive base's third ride (2026-10-01). Base books
        # bike far under its capacity ceiling, so the spin adds about 0.9 h a
        # week rather than shortening the long ride. Short and easy on purpose
        # — frequency, not a second long day.
        why: >-
          A short, easy spin midweek adds a third ride without adding fatigue.
          Riding often is how the bike leg becomes routine, and it is the
          cheapest training time in triathlon: low impact, high return.
      - name: comp_base_tue_swim_css
        day: tue
        activity: swim_css
        rotation: [swim_css, swim_threshold]
        metres: {competitive: [2000, 2500]}
        window: [0.6, 1.0]
        group: im_comp_base_swim_quality
        # intent: Late-BASE swim quality (2026-10-01), on the day the BUILD
        # week keeps it (comp_build_tue_swim_css), so late base already has
        # the build's shape at a lower dose.
        why: >-
          Late in base the swim picks up its first repeats at your
          race-relevant pace, shorter ones one week and longer ones the next.
          With your technique in place, this is where swim fitness starts to
          grow.
      - name: base_fri_swim_long
        day: fri
        activity: swim_long
        metres: {basic: [2250, 3000], competitive: [2500, 4000]}
        progression: im_long_swim
        why: >-
          The long swim builds the aerobic endurance that makes the race swim
          feel routine rather than daunting. Holding good form deep into a long
          swim is what gets you out of the water fresh enough to ride well.
      - name: base_sat_bike_long
        day: sat
        activity: bike_long
        minutes: {basic: [120, 165], competitive: [165, 245]}
        progression: im_long_bike
        why: >-
          The long ride is the backbone of full-distance training: the bike is over
          half your race day, and it builds fatigue resistance at the lowest recovery cost of the three sports. In base it stays steady and unhurried
          — length first, intensity later.
      - name: base_sat_brick
        day: sat
        activity: run_brick_short
        minutes: {basic: [12, 18], competitive: [15, 25]}
        brick: true
        why: >-
          A short run straight off the bike teaches your legs the transition
          without adding meaningful load. Kept small this early, it simply makes
          the odd bike-to-run feeling familiar long before it matters.
      - name: base_sun_long_run
        day: sun
        activity: run_long
        minutes: {basic: [55, 85], competitive: [65, 115]}
        progression: im_long_run
        why: >-
          The long run builds the fatigue-resistant aerobic running a full-distance marathon demands. It sits the day after the long ride on purpose —
          running on legs that are not fresh is exactly what race day will ask
          of you.
      - name: mod_base_tue_bike_test
        day: tue
        activity: bike_ftp_test
        minutes: {moderate: [42, 42]}
        cadence_weeks: 8
        group: im_mod_base_bike_quality
        key: 0.3
        # intent: Week 1 is the test week, as in the half-distance plan
        # (the maintainer's rule: tests in week 1 and every eight weeks for
        # every athlete). The cadence (R-SESS-041) fires a load slot in week 1
        # only; the later tests are the cadence slots in the base and build
        # recovery menus.
        why: >-
          Your first week opens with the tests that set the training zones every
          session in this plan is written against: a 20-minute all-out effort
          after a proper warm-up. Ride it rested and honest; the number only has
          to be yours. If you have tested in the last six weeks, ride this as an
          easy aerobic session instead.
      - name: mod_base_wed_swim_easy
        day: wed
        activity: swim_endurance
        metres: {moderate: [1800, 1800]}
        window: [0.0, 0.05]
        group: im_mod_base_wed_swim
        why: >-
          An easy, continuous swim in your test week. It keeps the pool routine
          going and leaves your arms fresh for Friday's swim test.
      - name: mod_base_wed_swim_css
        day: wed
        activity: swim_css
        rotation: [swim_css, swim_threshold]
        metres: {moderate: [1800, 1800]}
        window: [0.05, 1.0]
        group: im_mod_base_wed_swim
        # intent: The half's third swim and its Wednesday quality swim
        #. The old base held two swims and no swim
        # quality, and BUILD then added 1 h of swimming in one week.
        why: >-
          The week's quality swim, repeats at your threshold pace, shorter ones
          one week and longer ones the next. Swimming costs your legs almost
          nothing, so this work sits beside the midweek run and swim fitness
          grows from the start of the plan.
      - name: mod_base_wed_run_tempo
        day: wed
        activity: run_aerobic_tempo
        rotation: [run_aerobic_tempo, run_progression]
        minutes: {moderate: [45, 55]}
        window: [0.55, 1.0]
        group: im_mod_base_wed_run
        # intent: Late-BASE run quality, as in the half and the competitive
        # week: BUILD's threshold running continues a habit instead of
        # starting cold.
        why: >-
          Late in base the midweek run picks up, alternating a steady,
          comfortably firm tempo with a progression run that builds from easy to
          threshold pace. It gets your legs used to working before the build
          adds harder running.
      - name: mod_base_wed_run_test
        day: wed
        activity: run_threshold_test
        minutes: {moderate: [44, 44]}
        cadence_weeks: 8
        group: im_mod_base_wed_run
        key: 0.3
        why: >-
          Your first week opens with the tests that set the training zones every
          session in this plan is written against: a 30-minute threshold effort
          after a proper warm-up. Run it rested and honest; the number only has
          to be yours. If you have tested in the last six weeks, run this as an
          easy aerobic session instead.
      - name: mod_base_thu_ride_easy
        day: thu
        activity: bike_endurance
        minutes: {moderate: [40, 50]}
        window: [0.0, 0.05]
        group: im_mod_base_thu_ride
        why: >-
          A short, easy ride between the tests. The week is for the three tests,
          so the midweek ride stays light. The regular midweek ride starts next
          week.
      - name: mod_base_thu_bike_endurance
        day: thu
        activity: bike_endurance
        minutes: {moderate: [55, 85]}
        window: [0.05, 1.0]
        group: im_mod_base_thu_ride
        # intent: Grows with the week as in the half (55-80), so BUILD's midweek
        # ride (75-105) is a step and not the old jump from 55 to 100.
        why: >-
          A second, easier ride midweek. It adds aerobic volume at a low cost to
          your legs and keeps the weekend free for the long ride and the long
          run. It grows through base, so the longer midweek rides of the build
          feel like a continuation.
      - name: mod_base_fri_strides
        day: fri
        activity: run_strides
        minutes: {moderate: [26, 34]}
        window: [0.05, 1.0]
        why: >-
          A handful of relaxed strides inside an easy run. They keep your legs
          quick and your form crisp in a phase that is otherwise all steady
          running.
      - name: mod_base_fri_swim_test
        day: fri
        activity: swim_css_test
        metres: {moderate: [2350, 2350]}
        cadence_weeks: 8
        group: im_mod_base_fri_swim
        key: 0.3
        why: >-
          Your first week opens with the tests that set the training zones every
          session in this plan is written against: a 400 m and a 200 m time
          trial after a proper warm-up, which give you your swim pace. Swim them
          rested and honest; the number only has to be yours. If you have tested
          in the last six weeks, swim this as a steady endurance session
          instead.
      - name: mod_base_fri_swim_long
        day: fri
        activity: swim_long
        metres: {moderate: [2250, 3500]}
        progression: im_long_swim
        window: [0.05, 1.0]
        group: im_mod_base_fri_swim
        why: >-
          The long swim builds the aerobic endurance that makes the race swim
          feel routine rather than daunting. Holding good form deep into a long
          swim is what gets you out of the water fresh enough to ride well.
      - name: mod_base_sat_ride_easy
        day: sat
        activity: bike_endurance
        minutes: {moderate: [75, 90]}
        window: [0.0, 0.05]
        group: im_mod_base_sat_ride
        why: >-
          An easy ride to close your test week. The tests are done on fresh legs
          and the week lands a notch below what you have been doing. The long
          ride starts next week.
      - name: mod_base_sat_bike_long
        day: sat
        activity: bike_long
        minutes: {moderate: [85, 215]}
        progression: im_long_bike
        window: [0.05, 1.0]
        group: im_mod_base_sat_ride
        why: >-
          The long ride is the backbone of full-distance training: the bike is
          over half your race day, and it builds fatigue resistance at the
          lowest recovery cost of the three sports. In base it stays steady and
          unhurried: length first, intensity later.
      - name: mod_base_sat_brick
        day: sat
        activity: run_brick_short
        minutes: {moderate: [13, 21]}
        window: [0.5, 1.0]
        brick: true
        # intent: Late base only, as in the half.
        why: >-
          A short run straight off the bike teaches your legs the transition
          without adding meaningful load. Kept small this early, it simply makes
          the odd bike-to-run feeling familiar long before it matters.
      - name: mod_base_sun_run_easy
        day: sun
        activity: run_easy
        minutes: {moderate: [45, 60]}
        window: [0.0, 0.05]
        group: im_mod_base_sun_run
        why: >-
          A short, easy run to close your opening week. The week is for the
          three tests, so the weekend stays light. The long run starts next
          week.
      - name: mod_base_sun_long_run
        day: sun
        activity: run_long
        minutes: {moderate: [60, 100]}
        progression: im_long_run
        window: [0.05, 1.0]
        group: im_mod_base_sun_run
        why: >-
          The long run builds the fatigue-resistant aerobic running a full-
          distance marathon demands. It sits the day after the long ride on
          purpose: running on legs that are not fresh is exactly what race day
          will ask of you.

  base/recovery:
    slots:
      - name: rec_mon_swim
        day: mon
        activity: swim_recovery
        metres: {competitive: [2000, 2750]}
        why: >-
          An easy swim to open a recovery week: enough movement to keep your
          feel for the water, gentle enough that the week can do what it is for.
      - name: basic_rec_tue_bike
        day: tue
        # intent: BASIC tests over two recovery weeks (2026-10-03): bike and
        # swim in one, the run on its own in a later one. All three in one
        # 4-6 h recovery week did not fit, and the bike test fell out of every
        # plan (the fit drops a fixed protocol it cannot book). The windows
        # leave out the first base recovery week, too small at low volume to
        # hold a test, and never overlap, so no week draws all three; at 22-36
        # weeks each phase tests every sport at most once.
        why: >-
          A steady, easy ride: the frequency stays, the load comes off. Recovery
          weeks are where the previous weeks of training actually turn into
          fitness.
        variants:
          - activity: bike_endurance
            minutes: {basic: [35, 50]}
            window: [0.0, 0.21]
            group: im_basic_recovery_tue
          - activity: bike_ftp_test
            minutes: {basic: [42, 42]}
            window: [0.21, 0.42]
            group: im_basic_recovery_tue
            why: >-
              A bike test in a recovery week does double duty: it is the one
              hard effort you can afford when the volume is down, and it
              re-anchors the power targets every ride in the coming weeks is
              written against.
          - activity: bike_endurance
            minutes: {basic: [35, 50]}
            window: [0.42, 1.0]
            group: im_basic_recovery_tue
      - name: mod_rec_tue_test
        day: tue
        activity: bike_ftp_test
        minutes: {moderate: [42, 42]}
        cadence_weeks: 8
        key: 0.3
        group: im_mod_recovery_tue
        # intent: The eight-week cadence (R-SESS-041, since 2026-11-03, as in
        # the half): the recovery week nearest each eight-week mark tests, in
        # this session's place. key 0.3 keeps the fixed protocol in a squeezed
        # week.
        why: >-
          Every eight weeks, in a lighter week when your legs are rested, the
          tempo ride is the bike test instead: a 20-minute all-out effort after
          a proper warm-up, which sets the power targets every ride after it is
          written against.
      - name: mod_rec_tue_bike
        day: tue
        activity: bike_tempo
        minutes: {moderate: [48, 54]}
        group: im_mod_recovery_tue
        why: >-
          A short ride in a lighter week with a controlled tempo section:
          deliberately not a hard session, just enough intensity that next
          week's real work does not feel like starting over.
      - name: comp_rec_tue_test
        day: tue
        activity: bike_ftp_test
        minutes: {competitive: [42, 42]}
        window: [0.0, 0.55]
        group: im_recovery_tue
        why: >-
          A bike test in a recovery week does double duty: it is the one hard
          effort you can afford when the volume is down, and it re-anchors the
          power targets every ride in the coming weeks is written against.
      - name: comp_rec_tue_easy
        day: tue
