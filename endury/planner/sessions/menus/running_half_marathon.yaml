# running_half_marathon session menus. Format and validation ladder: AUTHORING.md.
goal: running_half_marathon
offered: [moderate]
progressions:
  # intent: Half-marathon long run.
  - half_marathon_long_run
menus:
  base/load:
    contract:
      must_contain: [run_long]
    slots:
      - name: hm_mod_base_sun_easy
        day: sun
        activity: run_easy
        minutes: {moderate: [45, 60]}
        window: [0.0, 0.05]
        group: hm_base_sun
        # intent: MODERATE's test week (R-SESS-B-000): the Wednesday test
        # plus easy sessions only, so the long run opens in week 2 from the
        # athlete's recent longest. The window holds the first base week
        # alone, where its midpoint is nearer than the long run's.
        why: >-
          An easy Sunday run in your opening week. The week is for the test,
          so the weekend stays light and the long run starts next week from
          the length you already run.
      - name: hm_base_sun_long_run
        day: sun
        why: >-
          The long run builds the endurance that keeps your half marathon pace
          from unravelling in the last 5 km. In these early weeks it grows
          gradually and stays easy — the specific speed gets layered on top of
          this foundation later.
        variants:
          - activity: run_long
            minutes: {basic: [46, 58], competitive: [70, 90]}
            progression: half_marathon_long_run
            group: hm_base_sun
          - activity: run_long
            minutes: {moderate: [60, 76]}
            progression: half_marathon_long_run
            group: hm_base_sun
            key: 0.5
            # intent: MODERATE keys its load-week long runs at 0.5, as the
            # trail menus do: a week short on time keeps the long run on its
            # ramp and shortens the easy runs, then drops one. Unkeyed, the
            # week's 50-minute threshold card came out of the long run (a
            # low-volume 10-week plan ran 75 then 66 minutes).
      - name: hm_base_tue_easy
        day: tue
        activity: run_easy
        minutes: {scaled: [35, 45]}
        why: >-
          Most of your aerobic fitness is actually built on easy runs, and they
          cost almost nothing to recover from. Keep this one conversational so
          the quality sessions later in the week land properly.
      - name: hm_base_thu_strides
        day: thu
        activity: run_strides
        minutes: {scaled: [35, 40]}
        why: >-
          Short relaxed accelerations keep your stride quick and efficient
          during a phase that is otherwise all easy running. They take a couple
          of minutes and cost you no freshness.
      - name: hm_base_fri_easy
        day: fri
        activity: run_easy
        minutes: {scaled: [30, 40]}
        why: >-
          A short easy run adds aerobic volume and keeps you running frequently,
          which is what toughens the tendons and connective tissue that adapt
          more slowly than your heart and lungs.
      - name: hm_base_wed_tempo
        day: wed
        activity: run_aerobic_tempo
        minutes: {scaled: [35, 45]}
        group: hm_base_wed
        why: >-
          A steady aerobic tempo — comfortably strong, never hard — introduces
          controlled intensity early, so the sharper threshold work later has a
          base to stand on.
      - name: hm_mod_base_wed_test
        day: wed
        activity: run_threshold_test
        minutes: {moderate: [55, 55]}
        cadence_weeks: 8
        key: 0.6
        group: hm_base_wed
        # intent: Week 1 is the test week (R-SESS-B-000): the test opens the
        # plan in the steady tempo's place, so the zones exist from day one,
        # and fires again every eight weeks in a recovery week (the cadence
        # slots in the recovery menus), never in peak. Before this MODERATE
        # tested once, in the peak recovery week: never at 8 to 12 weeks.
        # Bounds at the card's 55 minutes. key 0.6: the card is about 0.55
        # of the smallest recovery week the plan is offered at (0.85 of the
        # default volume), and a test whose share falls short is the first
        # thing a squeezed week drops; the easy runs shorten first.
        why: >-
          Your first week opens with the test that sets the training zones
          every run in this plan is written against: a 30-minute threshold
          effort after a proper warm-up, in place of the steady tempo. Run it
          rested and honest — the number only has to be yours. If you have
          tested in the last six weeks, run this as an easy aerobic session
          instead.

  # Recovery weeks (2026-09-25): each phase authors its own recovery week,
  # sized against the load weeks each tier actually gets in that phase —
  # about 0.6 of the preceding load week at MODERATE and COMPETITIVE, up to
  # the 0.5 capacity ceiling at BASIC — with no run under 20 minutes. The old
  # shared anchor put the threshold test in every recovery week: BASIC could
  # never fit it and ran three 16-40 min runs (~0.4 of the load week), and
  # COMPETITIVE tested every time. The test now fires in the PEAK recovery
  # week only (peak/recovery); base and build recovery weeks are easy.
  base/recovery:
    slots:
      - name: hm_base_rec_sun_long_run
        day: sun
        activity: run_long
        minutes: {basic: [35, 45], moderate: [45, 55], competitive: [50, 55]}
        why: >-
          The long run stays in an easier week, just shorter. It keeps your
          legs used to Sunday's time on feet, so next week's longer run picks
          up where the last one left off instead of starting over.
      - name: hm_base_rec_tue_easy
        day: tue
        activity: run_easy
        minutes: {basic: [20, 25], moderate: [25, 30], competitive: [30, 35]}
        why: >-
          Easier weeks are when the previous weeks' work converts into fitness —
          fatigue clears faster than fitness fades. Run easy, keep the habit,
          and let the reduced load do its job.
      - name: hm_base_rec_wed_easy
        day: wed
        activity: run_easy
        minutes: {moderate: [25, 30], competitive: [25, 30]}
        group: hm_base_rec_wed
        why: >-
          Another short, easy run. Running most days at a fraction of the usual
          load keeps your legs used to the work while the hard sessions step
          aside for a week.
      - name: hm_mod_base_rec_wed_test
        day: wed
        activity: run_threshold_test
        minutes: {moderate: [55, 55]}
        cadence_weeks: 8
        key: 0.6
        group: hm_base_rec_wed
        # intent: MODERATE's eight-week test (R-SESS-B-000): on the recovery
        # week nearest each eight-week mark the easy Wednesday is the test,
        # keyed as the week-1 test. Every other recovery week keeps the easy
        # run.
        why: >-
          Every eight weeks, in a lighter week when you are rested enough for
          the number to mean something, this easy Wednesday is the threshold
          test instead: a 30-minute effort after a proper warm-up, which
          updates the paces the rest of your running is built on.
      - name: hm_base_rec_fri_easy
        day: fri
        activity: run_easy
        minutes: {basic: [20, 25], moderate: [20, 25], competitive: [25, 25]}
        why: >-
          Another easy run keeps your frequency and running mechanics intact
          while total load drops. Don't top the mileage back up — the reduction
          is the point.

  build/load:
    slots:
      - name: hm_build_sun_long_run
        day: sun
        # intent: The ceiling sits below the peak long run's floor at every
        # tier, after the ramp's 5-minute rounding, so the plan's longest run
        # lands in PEAK; a shared 120 top let the build's ramp reach it while
        # the peak run held its floor.
        why: >-
          The long run keeps growing because half marathon pace is fundamentally
          an aerobic problem — you need the endurance to still be running strong
          at 18 km. Keep most of it easy; the value is in the duration.
        variants:
          - activity: run_long
            minutes: {basic: [58, 68], competitive: [90, 105]}
            progression: half_marathon_long_run
          - activity: run_long
            minutes: {moderate: [76, 89]}
            progression: half_marathon_long_run
            key: 0.5  # as hm_base_sun_long_run
      - name: hm_build_tue_tempo
        day: tue
        why: >-
          Tempo running sits close to the effort you will hold on race day, and
          stretching how long you can sustain it is the core adaptation of this
          phase. This is the session that most directly moves your race pace.
        variants:
          - activity: run_tempo
            rotation: [run_tempo, run_fartlek]
            minutes: {basic: [26, 36], competitive: [40, 55]}
          - activity: run_tempo
            rotation: [run_tempo, run_fartlek]
            minutes: {moderate: [38, 47]}
            # intent: MODERATE's bounds sit at the cards' sizes, not the
            # COMPETITIVE literals scaled: the fartlek card is at least 38
            # minutes, which the scaled 34 booked under.
      - name: hm_build_thu_threshold
        day: thu
        why: >-
          Threshold work raises the ceiling your race pace sits under, and the
          harder interval sessions that take its place some weeks sharpen your
          top end so threshold feels comparatively easy. This phase is the right
          window: early enough for the gains to stick, far enough out to absorb
          the cost.
        variants:
          - activity: run_threshold
            rotation: [run_threshold, run_vo2max]
            minutes: {basic: [23, 32], competitive: [35, 50]}
          - activity: run_threshold
            rotation: [run_threshold, run_vo2max]
            minutes: {moderate: [50, 55]}
            # intent: MODERATE at the cards' sizes: the threshold card is at
            # least 50 minutes (four reps) and the VO2max card 44-58, so the
            # scaled 30-42 booked a session no card could hold.
      - name: hm_build_fri_easy
        day: fri
        activity: run_easy
        minutes: {scaled: [30, 40]}
        why: >-
          An easy run between hard days keeps blood moving and volume up without
          adding fatigue. Its whole job is to leave you ready for the next
          quality session.
      - name: hm_build_wed_strides
        day: wed
        # intent: 2026-09-25, was a progression run between Tuesday's
        # tempo/fartlek and Thursday's threshold/VO2max run: three quality days
        # in a row put 16 % of the plan's running at tempo or harder, against about 10 %
        # a half-marathon plan needs.
        # Hard/easy alternation now: quality Tue and Thu, easy Wed and Fri;
        # the strides keep a few minutes of fast running without a hard day.
        why: >-
          An easy run between the week's two key sessions, finished with a few
          short, relaxed strides. It adds aerobic volume at a gentle effort and
          keeps your legs quick, so Tuesday and Thursday get your best running.
        variants:
          - activity: run_strides
            minutes: {basic: [23, 29], competitive: [35, 45]}
          - activity: run_strides
            minutes: {moderate: [30, 36]}
            # intent: MODERATE tops out at the strides card's 36 minutes.

  build/recovery:
    slots:
      - name: hm_build_rec_sun_long_run
        day: sun
        activity: run_long
        minutes: {basic: [40, 50], moderate: [50, 60], competitive: [55, 65]}
        why: >-
          The long run stays in an easier week, just shorter. It keeps your
          legs used to Sunday's time on feet, so next week's longer run picks
          up where the last one left off instead of starting over.
      - name: hm_build_rec_tue_easy
        day: tue
        activity: run_easy
        minutes: {basic: [20, 30], moderate: [25, 35], competitive: [30, 35]}
        why: >-
          Easier weeks are when the previous weeks' work converts into fitness —
          fatigue clears faster than fitness fades. Run easy, keep the habit,
          and let the reduced load do its job.
      - name: hm_build_rec_wed_easy
        day: wed
        activity: run_easy
        minutes: {moderate: [25, 30], competitive: [30, 35]}
        group: hm_build_rec_wed
        why: >-
          Another short, easy run. Running most days at a fraction of the usual
          load keeps your legs used to the work while the hard sessions step
          aside for a week.
      - name: hm_mod_build_rec_wed_test
        day: wed
        activity: run_threshold_test
        minutes: {moderate: [55, 55]}
        cadence_weeks: 8
        key: 0.6
        group: hm_build_rec_wed
        # intent: As hm_mod_base_rec_wed_test.
        why: >-
          Every eight weeks, in a lighter week when you are rested enough for
          the number to mean something, this easy Wednesday is the threshold
          test instead: a 30-minute effort after a proper warm-up, which
          updates the paces the rest of your running is built on.
      - name: hm_build_rec_fri_easy
        day: fri
        activity: run_easy
        minutes: {basic: [20, 25], moderate: [25, 30], competitive: [25, 30]}
        why: >-
          Another easy run keeps your frequency and running mechanics intact
          while total load drops. Don't top the mileage back up — the reduction
          is the point.

  peak/load:
    slots:
      - name: hm_peak_sun_long_run
        day: sun
        why: >-
          The long run holds near its longest so the endurance stays put while
          the emphasis shifts to sharpening. Race day is close enough now that
          this is maintenance, not building.
        variants:
          - activity: run_long
            minutes: {basic: [72, 78], competitive: [110, 120]}
            progression: half_marathon_long_run
          - activity: run_long
            minutes: {moderate: [94, 102]}
            progression: half_marathon_long_run
            key: 0.5  # as hm_base_sun_long_run
      - name: hm_peak_tue_tempo
        day: tue
        activity: run_tempo
        minutes: {scaled: [40, 55]}
        why: >-
          Sharpening means time at or near race effort, and for the half
          marathon that is tempo. Goal pace should start feeling repeatable
          rather than ambitious — that is the sign this phase is doing its job.
      - name: hm_peak_thu_threshold
        day: thu
        why: >-
          A shorter, sharp threshold session keeps your sustainable pace honed
          while total volume comes down. Enough to hold the edge, not enough to
          leave a hole this close to the race.
        variants:
          - activity: run_threshold
            minutes: {basic: [23, 29], competitive: [35, 45]}
          - activity: run_threshold
            minutes: {moderate: [50, 50]}
            # intent: MODERATE books the threshold card's shortest, four reps
            # in 50 minutes; the scaled 30-38 was under every card.
      - name: hm_peak_fri_easy
        day: fri
        activity: run_easy
        minutes: {scaled: [30, 40]}
        why: >-
          Easy running between the two quality days keeps your running frequency
          up while fatigue is being managed rather than accumulated.

  # intent: 2026-09-25. The threshold test fires in this one recovery week:
  # every plan length has exactly one PEAK recovery week, its ceiling holds
  # the 55-min protocol next to three easy runs, the share lands at 1 of 2 or
  # 1 of 3 recovery weeks (the band is 0.40-0.50),
  # and the number sets the race pace for the final block. BASIC keeps an
  # easy week: its 0.5 ceiling could never hold the test. MODERATE tests
  # in week 1 and every eight weeks instead (R-SESS-B-000, never in peak),
  # so its peak recovery week is easy.
  peak/recovery:
    slots:
      - name: hm_peak_rec_sun_long_run
        day: sun
        activity: run_long
        minutes: {basic: [45, 55], moderate: [40, 50], competitive: [55, 60]}
        why: >-
          The long run stays in an easier week, just shorter. It keeps your
          legs used to Sunday's time on feet, so next week's longer run picks
          up where the last one left off instead of starting over.
      - name: hm_peak_rec_tue_easy
        day: tue
        activity: run_easy
        minutes: {basic: [25, 30], moderate: [25, 30], competitive: [30, 30]}
        why: >-
          Easier weeks are when the previous weeks' work converts into fitness —
          fatigue clears faster than fitness fades. Run easy, keep the habit,
          and let the reduced load do its job.
      - name: hm_mod_peak_rec_wed_easy
        day: wed
        activity: run_easy
        minutes: {moderate: [25, 30]}
        why: >-
          Another short, easy run. Running most days at a fraction of the usual
          load keeps your legs used to the work while the hard sessions step
          aside for a week.
      - name: hm_peak_rec_wed_test
        day: wed
        activity: run_threshold_test
        minutes: {competitive: [44, 44]}
        why: >-
          A short test on an easier week catches you fresh enough for an honest
          result and refreshes the paces every other session is built from. Half
          marathon training is anchored on your threshold pace, so it is worth
          measuring rather than guessing.
      - name: hm_peak_rec_fri_easy
        day: fri
        activity: run_easy
        minutes: {basic: [25, 30], moderate: [20, 25], competitive: [25, 30]}
        why: >-
          Another easy run keeps your frequency and running mechanics intact
          while total load drops. Don't top the mileage back up — the reduction
          is the point.

  # The taper was easy runs and strides: it held ~3% of its biggest week's
  # quality minutes and ~30% of its volume. It now keeps the peak week's
  # Sunday long run (shorter) and Tuesday tempo. Thursday's threshold stays
  # behind: its 4-rep floor (50 min, 20 quality minutes) on top of the tempo
  # gave the 10-week tapers more quality than their biggest week and cost
  # race-day freshness, for a worse score than the tempo alone. Runners on
  # ~1-1.5 h/week read worse on both: capacity drops every hard session from
  # their build weeks, so the taper tempo out-holds their peak.
  taper/taper:
    slots:
      - name: hm_taper_sun_long_run
        day: sun
        activity: run_long
        minutes: {scaled: [60, 70]}
        eases: half_marathon_long_run
        # intent: 2026-09-29: at most 0.75 of the longest long run booked
        # (R-SESS-034), so a small athlete's taper long run stays under their
        # peak one.
        why: >-
          The long run stays, shorter than at its peak. It keeps
          the endurance you built ticking over while the fatigue of the last
          block drains out before race week.
      - name: hm_taper_tue_tempo
        day: tue
        activity: run_tempo
        minutes: {scaled: [45, 50]}
        # intent: Tempo is the half marathon's race-specific effort; keeping
        # it (bounds inside the peak's [40, 55]) is what holds the taper's
        # intensity while its volume falls (tlc §7, "intensity maintained in
        # short touches").
        why: >-
          Tempo is the effort closest to half marathon pace, so it stays in the
          week while everything around it gets lighter. It keeps race effort
          feeling familiar for the day itself.
      - name: hm_taper_fri_easy
        day: fri
        activity: run_easy
        minutes: {scaled: [25, 30]}
        why: >-
          A brief easy run to hold your rhythm going into race week. More volume
          now costs freshness and buys nothing.
      - name: hm_taper_thu_strides
        day: thu
        activity: run_strides
        minutes: {basic: [13, 16], moderate: [27, 30], competitive: [20, 25]}
        # intent: MODERATE at the strides card's 27-minute floor, which every
        # tier is booked at anyway.
        why: >-
          A few quick accelerations keep fast running feeling familiar while the
          mileage falls away. Dropping the intensity as well as the volume is
          what leaves people flat on the start line.

  taper/race:
    slots:
      - name: hm_race_tue_easy
        day: tue
        activity: run_easy
        minutes: [30, 30]
        why: >-
          Race week keeps you moving and does nothing else — short and easy,
          purely to stay in rhythm.
      - name: hm_race_thu_easy
        day: thu
        activity: run_easy
        minutes: [20, 20]
        why: >-
          A brief shakeout to keep the legs turning over. Nothing this week can
          make you fitter; several things could make you tired.
      - name: hm_race_sat_strides
        day: sat
        activity: run_strides
        minutes: {basic: [15, 15], moderate: [27, 27], competitive: [15, 15]}
        # intent: MODERATE at the strides card's 27-minute floor, which every
        # tier is booked at anyway.
        why: >-
          A handful of relaxed accelerations the day before wakes up your legs
          and your nervous system without touching your freshness.
