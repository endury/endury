      - *t20_mon_spin
      - *t20_rec_sat_spin

  taper/taper:
    contract:
      must_contain: [run_hill_repeats, run_trail_long]
      must_not_contain: [run_downhill_repeats, run_trail_b2b]
      weekly_quality_sessions: [1, 1]
    slots:
      - name: t20_taper_sun_long_run
        day: sun
        activity: run_trail_long
        key: 0.5
        minutes: {basic: [60, 75], moderate: [76, 94], competitive: [90, 110]}
        eases: trail_20k_long_run
        # intent: The long run survives the taper, shortened: tr §11.3's
        # 'frequency maintained or reduced by at most one day' keeps a real long
        # day on the calendar. Keeping it on trail is not optional:
        # tr §11.3's named anti-example is the athlete who swaps mountain trails
        # for a flat track before the race.
        why: >-
          The long run stays, shortened. You will not gain endurance now, but
          your legs need to keep remembering what trail running feels like — so
          keep it on trails, not on flat road or a treadmill.
      - name: t20_basic_taper_tue_hills
        day: tue
        activity: run_hill_repeats
        key: 0.45
        minutes: {basic: [50, 55]}
        # intent: BASIC's taper climb takes up to 0.45 of a squeezed week, as
        # the maintenance block's climb day does. Its card cannot go under
        # 50 min, and a hard session that cannot fit leaves a taper week
        # outright: at the shared 0.25 a taper week under 3.3 h (the 8-week
        # plan, an athlete at 0.75 of the default volume) lost the climb and
        # kept its easy run and strides. At 0.45 the climb and the long run
        # stay and the easy run turns optional.
        why: >-
          Climbing continues into the taper: same effort, less of it. Climbing
          fitness fades quickly, so the last thing to cut is the intensity —
          what gets cut is the volume. Downhill work is off the table now; that
          soreness would still be with you on race day.
      - name: t20_taper_tue_hills
        day: tue
        activity: run_hill_repeats
        key: 0.25
        minutes: {moderate: [38, 47], competitive: [45, 55]}
        # intent: Vertical specificity is maintained through the taper,
        # unchanged in kind and cut only in volume — tr §7.3 makes vert the
        # adaptation that decays fastest, and tr §11.3 preserves intensity while
        # cutting the volume of intensity (worked example: 4x10' tempo -> 3x5'
        # -> 2x5'). The zone never changes; the clock does.
        # Descent work is excluded by contract: its 48-72 h DOMS peak has no
        # place in the run-in.
        why: >-
          Climbing continues into the taper: same effort, less of it. Climbing
          fitness fades quickly, so the last thing to cut is the intensity —
          what gets cut is the volume. Downhill work is off the table now; that
          soreness would still be with you on race day.
      - name: t20_taper_wed_easy
        day: wed
        activity: run_easy
        minutes: {basic: [35, 45], moderate: [38, 49], competitive: [45, 58]}
        why: >-
          Easy running, shorter than usual. The training is done; this is about
          staying loose and keeping your rhythm.
      - name: t20_taper_thu_easy
        day: thu
        activity: run_easy
        minutes: {moderate: [34, 42], competitive: [40, 50]}
        why: >-
          A short, easy run. If it feels too easy, that is the taper working.
      - name: t20_taper_fri_strides
        day: fri
        activity: run_strides
        minutes: {basic: [27, 33], moderate: [30, 38], competitive: [35, 45]}
        # intent: Short, relaxed, fast — the taper's one piece of pure
        # neuromuscular upkeep.
        why: >-
          A handful of short, fast, relaxed pickups — enough to remind your legs
          how to move quickly, nowhere near enough to tire them. This is the
          taper's only piece of pure sharpening.

  taper/race:
    contract:
      must_not_contain: [run_downhill_repeats, run_trail_b2b]
    slots:
      - name: t20_race_tue_fartlek
        day: tue
        activity: run_fartlek
        minutes: {basic: [38, 38], moderate: [38, 38], competitive: [42, 42]}
        # intent: Race week keeps one genuine effort, five days out: short reps at race pace
        # and faster, finishing with plenty left in the tank. This is tr §11.3's
        # rule made concrete — intensity is preserved, the volume of intensity
        # is cut.
        why: >-
          One genuine effort five days out: a set of short, fast reps at race pace and a touch quicker. It keeps you sharp and finishes
          with plenty left in the tank — the fitness is already banked.
      - name: t20_race_thu_easy
        day: thu
        activity: run_easy
        minutes: {basic: [25, 25], moderate: [28, 28], competitive: [30, 30]}
        why: >-
          A short easy run two days out. Circulation and rhythm, nothing more.
      - name: t20_basic_race_sat_shakeout
        day: sat
        activity: run_easy
        minutes: {basic: [20, 20]}
        # intent: the strides card cannot build under 27 min (10 min warm-up
        # and cool-down around the strides), longer than the moderate and
        # competitive shake-outs; a basic athlete gets a plain 20-minute
        # easy run the day before.
        why: >-
          Twenty relaxed minutes the day before, nothing more: legs loose,
          nerves settled, everything else saved for tomorrow.
      - name: t20_race_sat_strides
        day: sat
        activity: run_strides
        minutes: {moderate: [22, 22], competitive: [25, 25]}
        # intent: Openers the day before: a short easy run carrying a handful of
        # relaxed strides.
        why: >-
          Openers the day before: a short jog carrying a few relaxed strides. It
          takes the flatness out of rested legs so race morning does not feel
          like your first hard effort in a week.
